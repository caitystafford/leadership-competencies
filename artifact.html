/* This design commits to one visual world — the light competency artwork — so
   it does not swap with the viewer's theme. Every colour and the page ground
   are painted explicitly so it holds on either host background. */
:root {
  --navy: #150721;
  --blue-green: #85e3f4;
  --lime: #e3eb7b;
  --yellow: #ecb21f;
  --peach: #ef9281;
  --purple: #b5a4d0;
  --red: #981a30;
  --green: #163300;

  /* Neutrals biased a touch warm, toward the peach in the artwork. */
  --paper: #ffffff;
  --wash: #f8f6f4;
  --wash-deep: #efeae7;

  --ink: #150721;
  --ink-mid: rgba(21, 7, 33, 0.64);
  --ink-soft: rgba(21, 7, 33, 0.44);
  --rule: rgba(21, 7, 33, 0.10);
  --rule-soft: rgba(21, 7, 33, 0.06);

  --font: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

  --pad: 28px;
  --wide: 1180px;
  --narrow: 880px;

  --shadow-sm: 0 1px 2px rgba(21, 7, 33, 0.04), 0 8px 22px rgba(21, 7, 33, 0.05);
  --shadow-md: 0 2px 8px rgba(21, 7, 33, 0.06), 0 22px 50px rgba(21, 7, 33, 0.10);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  background: var(--wash);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
svg.icon { display: block; }

:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; border-radius: 4px; }
.topbar :focus-visible { outline-color: var(--peach); }

/* ---------- Type ---------------------------------------------------------- */

.eyebrow {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.headline {
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.035em;
  line-height: 0.96;
  text-wrap: balance;
  font-variant-numeric: tabular-nums;
}
.micro { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.prose { font-size: 16.5px; font-weight: 500; line-height: 1.65; color: var(--ink-mid); max-width: 62ch; }

/* ---------- Logo ---------------------------------------------------------- */

.logo {
  display: inline-flex;
  align-items: baseline;
  font-weight: 900;
  font-size: 18px;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
.logo-colon { margin: 0 1px 0 2px; }
.logo-one { margin-left: 5px; }
.logo-img { display: block; height: 26px; width: auto; }

/* ---------- Shell --------------------------------------------------------- */

.shell { min-height: 100vh; display: flex; flex-direction: column; }
.shell main { flex: 1; }

.spectrum { height: 4px; display: flex; }
.spectrum span { flex: 1; }

.topbar { position: sticky; top: 0; z-index: 50; background: var(--navy); color: #fff; }
.topbar-inner {
  max-width: var(--wide);
  margin: 0 auto;
  padding: 13px var(--pad);
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.brandline { display: flex; align-items: center; gap: 14px; background: none; border: 0; padding: 0; cursor: pointer; }
.brandline .divider { width: 1px; height: 20px; background: rgba(255, 255, 255, 0.22); }
.brandline .app-name {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.6);
  text-align: left;
}

.modes { display: flex; gap: 3px; margin-left: auto; }
.mode {
  background: none;
  border: 0;
  cursor: pointer;
  padding: 9px 18px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.58);
  transition: color 140ms ease, background-color 140ms ease;
}
.mode:hover { color: #fff; }
.mode[aria-current='true'] { background: #fff; color: var(--navy); }

/* ---------- Rail ---------------------------------------------------------- */

.rail {
  position: sticky;
  top: 52px;
  z-index: 45;
  background: rgba(248, 246, 244, 0.94);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
}
.rail-inner {
  max-width: var(--wide);
  margin: 0 auto;
  padding: 10px var(--pad);
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}

.crumbs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; min-width: 0; }
.crumb {
  background: none;
  border: 0;
  cursor: pointer;
  padding: 5px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
  max-width: 30ch;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: color 140ms ease, background-color 140ms ease;
}
.crumb:hover:not(:disabled) { color: var(--ink); background: var(--wash-deep); }
.crumb:disabled { cursor: default; color: var(--ink); }
.crumb-sep { color: rgba(21, 7, 33, 0.24); font-size: 12px; }

.rail-right { display: flex; align-items: center; gap: 16px; margin-left: auto; flex-wrap: wrap; }
.rail-label { font-size: 10px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }

/* Level is a lens on the whole framework, so it is always visible. Only the
   active pill carries colour — as a dot, not a fill. */
.lens { display: flex; align-items: center; gap: 9px; }
.lens-set { display: flex; gap: 2px; background: var(--wash-deep); border-radius: 999px; padding: 3px; }
.lens-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  background: none;
  border: 0;
  cursor: pointer;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mid);
  white-space: nowrap;
  transition: color 140ms ease, background-color 140ms ease;
}
.lens-btn::before {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: var(--lens-dot);
  opacity: 0.4;
  transition: opacity 140ms ease;
}
.lens-btn:hover { color: var(--ink); }
.lens-btn[aria-pressed='true'] { background: var(--paper); color: var(--ink); box-shadow: var(--shadow-sm); }
.lens-btn[aria-pressed='true']::before { opacity: 1; }

/* ---------- Layers -------------------------------------------------------- */

.layer { max-width: var(--wide); margin: 0 auto; padding: 38px var(--pad) 90px; }
.layer.narrow { max-width: var(--narrow); }

.layer[data-motion='in'] { animation: zoomIn 320ms var(--ease-out) both; }
.layer[data-motion='out'] { animation: zoomOut 320ms var(--ease-out) both; }
.layer[data-motion='flat'] { animation: fadeUp 260ms var(--ease-out) both; }

@keyframes zoomIn { from { opacity: 0; transform: scale(0.97); } }
@keyframes zoomOut { from { opacity: 0; transform: scale(1.025); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } }
@keyframes popIn { from { opacity: 0; transform: scale(0.96); } }
@keyframes orbitIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } }
@keyframes chipIn { from { opacity: 0; } }
@keyframes drawLead { from { stroke-dashoffset: 60; } }
@keyframes gaugeIn { from { stroke-dashoffset: 264; } }
@keyframes growBar { from { transform: scaleX(0); } }

/* ---------- Buttons ------------------------------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: none;
  border-radius: 999px;
  padding: 15px 30px;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--navy);
  color: #fff;
  transition: transform 140ms var(--ease-out), filter 140ms ease;
}
.btn:active { transform: scale(0.97); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--rule); }
.btn.ghost:hover { border-color: rgba(21, 7, 33, 0.3); }
.btn.small { padding: 11px 20px; font-size: 12px; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn:disabled:active { transform: none; }
@media (hover: hover) and (pointer: fine) {
  .btn:not(:disabled):not(.ghost):hover { filter: brightness(1.35); }
}

/* ---------- Hero ---------------------------------------------------------- */

/* The framework diagram is the point of the page, so the hero is laid out to
   cost as little height as possible — the title and the how-to-read-it note
   sit side by side, and the first ring starts inside the opening screen. */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(270px, 0.95fr);
  gap: 20px 46px;
  align-items: end;
  margin-bottom: 26px;
}
.hero-text { max-width: 62ch; }
.hero h1 { font-size: clamp(30px, 3.5vw, 42px); margin: 10px 0 0; }
.lede-strong {
  margin-top: 16px;
  font-size: clamp(17px, 1.75vw, 20px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.4;
  max-width: 30ch;
  color: var(--ink-mid);
}
.hero .prose { margin-top: 16px; }

/* ---------- Sections ------------------------------------------------------ */

.layer > section { margin-bottom: 60px; }
.layer > section:last-child { margin-bottom: 0; }

.sec-head { margin-bottom: 22px; max-width: 62ch; }
.sec-head h2 {
  font-size: clamp(21px, 2.4vw, 26px);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.025em;
  text-wrap: balance;
}
.sec-head p { margin-top: 9px; font-size: 15.5px; color: var(--ink-mid); line-height: 1.55; }
.sec-foot { margin-top: 18px; font-size: 14px; color: var(--ink-soft); }
.sec-foot b { color: var(--ink); }

/* ---------- Screen 1: the framework ---------------------------------------
   Each domain gets the full width of the layer, so the ring is big enough to
   read the five competency names off it without clicking anything.
   ------------------------------------------------------------------------- */

/* One line per step, so the whole orientation costs about a hundred pixels and
   the first ring stays inside the opening screen. */
.steps { display: flex; flex-direction: column; }
.step {
  display: flex;
  align-items: baseline;
  gap: 9px;
  flex-wrap: wrap;
  border-top: 1px solid var(--rule);
  padding: 9px 0;
}
.step:last-child { border-bottom: 1px solid var(--rule); }
.step .st-n {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.step b { font-size: 15px; font-weight: 900; letter-spacing: -0.025em; }
.step span { font-size: 13.5px; color: var(--ink-mid); line-height: 1.45; }

.fw-domain {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 26px;
  padding: 34px 34px 30px;
  margin-bottom: 20px;
  scroll-margin-top: 140px;
}

.fwd-head { display: flex; align-items: flex-start; gap: 20px; }
.fwd-num {
  width: 44px;
  height: 44px;
  border-radius: 999px;
  background: var(--core);
  color: var(--core-ink);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  font-size: 14px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.fwd-text { flex: 1; min-width: 0; }
.fwd-text h2 {
  font-size: clamp(28px, 3.6vw, 40px);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.04em;
  line-height: 0.98;
  margin-top: 6px;
}
.fwd-text p { margin-top: 9px; font-size: 16px; color: var(--ink-mid); line-height: 1.5; max-width: 46ch; }
.fwd-count {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-soft);
  line-height: 1.7;
  text-align: right;
  flex-shrink: 0;
}

.ring-note {
  text-align: center;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
  margin-top: 6px;
}

/* One representation at a time: the ring where there is room for it, the list
   where there is not. The responsive block swaps them. Written against
   .comp-list so it outranks that rule further down the sheet. */
.comp-list.page-list { display: none; }

/* ---------- Competency card ----------------------------------------------- */

.comp-card {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 16px;
  padding: 12px 14px;
  cursor: pointer;
  transition: border-color 160ms ease, background-color 160ms ease, transform 160ms var(--ease-out);
}
.comp-card:active { transform: scale(0.995); }
.cc-badge {
  width: 42px;
  height: 42px;
  border-radius: 999px;
  background: var(--fill);
  color: var(--node-ink);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.cc-text { flex: 1; min-width: 0; }
.cc-name { display: block; font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.025em; }
.cc-beh { display: block; margin-top: 3px; font-size: 13.5px; color: var(--ink-mid); line-height: 1.45; }
.cc-cta {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  border-radius: 999px;
  background: var(--wash-deep);
  color: var(--ink-mid);
  display: grid;
  place-items: center;
  font-size: 15px;
  transition: background-color 160ms ease, color 160ms ease, transform 160ms var(--ease-out);
}
@media (hover: hover) and (pointer: fine) {
  .comp-card:hover { border-color: rgba(21, 7, 33, 0.3); background: var(--wash); }
  .comp-card:hover .cc-cta { background: var(--navy); color: #fff; transform: translateX(2px); }
}

.comp-list { display: flex; flex-direction: column; gap: 9px; }

/* ---------- How leadership grows ------------------------------------------ */

.grow-list { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--rule); }
.grow-row {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 15px 4px;
  border-bottom: 1px solid var(--rule);
  flex-wrap: wrap;
}
.gr-dot { width: 10px; height: 10px; border-radius: 999px; flex-shrink: 0; align-self: center; }
.gr-name { font-size: 17px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.025em; min-width: 9ch; }
.gr-focus { font-size: 15px; color: var(--ink-mid); flex: 1; min-width: 220px; }
.gr-now {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--wash-deep);
  border-radius: 999px;
  padding: 5px 11px;
  align-self: center;
}

.linkish {
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  font: inherit;
  color: var(--ink);
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* ---------- Screen 2: one competency -------------------------------------- */

.comp-hero { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 4px; }
.ch-badge {
  width: 62px;
  height: 62px;
  border-radius: 999px;
  background: var(--fill);
  color: var(--node-ink);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  margin-top: 4px;
}
.ch-text { flex: 1; min-width: 0; }
.ch-domain { background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.ch-domain::before { content: ''; width: 9px; height: 9px; border-radius: 999px; background: var(--core); }
.ch-domain:hover { color: var(--ink); }
.comp-hero h1 { font-size: clamp(34px, 5vw, 52px); margin: 10px 0 0; }
.comp-hero .prose { margin-top: 12px; }

.xbs { margin-top: 4px; }
.more { margin-top: 46px; padding-top: 8px; border-top: 1px solid var(--rule); }
.more .sec-head { margin-top: 24px; }

.xb { border-top: 1px solid var(--rule); padding: 24px 0 6px; }
.xb-top { display: flex; gap: 13px; align-items: flex-start; margin-bottom: 14px; }
.xb-num { font-size: 11px; font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; padding-top: 5px; flex-shrink: 0; }
.xb h3 { font-size: 19px; font-weight: 900; letter-spacing: -0.03em; }
.xb-top p { margin-top: 3px; font-size: 14px; color: var(--ink-mid); line-height: 1.5; }
.xb-rungs { display: flex; flex-direction: column; gap: 7px; }

/* ---------- Search section ------------------------------------------------ */

.search-sec .searchbar { margin-bottom: 18px; }

/* ---------- Level banner --------------------------------------------------- */

.level-banner {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 16px;
  padding: 15px 18px;
  margin: 18px 0 34px;
  font-size: 14.5px;
  color: var(--ink-mid);
  line-height: 1.55;
}
.level-banner b { color: var(--ink); }
.lb-dot { width: 11px; height: 11px; border-radius: 999px; flex-shrink: 0; margin-top: 6px; }

/* ---------- The ring ------------------------------------------------------ */

.orbit-wrap { position: relative; padding: 8px 0 0; }
.orbit { position: relative; width: 100%; container-type: inline-size; }

.orbit-leads { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.orbit-leads line {
  stroke: rgba(21, 7, 33, 0.42);
  stroke-width: 2;
  stroke-dasharray: 2 5;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
  animation: drawLead 700ms var(--ease-out) both;
  animation-delay: 260ms;
  transition: stroke 160ms ease, opacity 160ms ease;
}

/* Hovering one competency quiets the other four, so a single spoke — disc,
   dotted lead, pointer, chip — reads as one object. */
@media (hover: hover) and (pointer: fine) {
  .orbit:not([data-focus='']) .orbit-node,
  .orbit:not([data-focus='']) .orbit-chip,
  .orbit:not([data-focus='']) .orbit-leads line { opacity: 0.3; }
  .orbit:not([data-focus='']) .orbit-node.is-focus,
  .orbit:not([data-focus='']) .orbit-chip.is-focus,
  .orbit:not([data-focus='']) .orbit-leads line.is-focus { opacity: 1; }
  .orbit-leads line.is-focus { stroke: var(--ink); }
}

/* `top` and `width` come from CORE in brand.js so all orbit geometry stays in
   one place. */
.orbit-core {
  position: absolute;
  left: 50%;
  transform: translate(-50%, -50%);
  aspect-ratio: 1;
  border-radius: 999px;
  background: var(--core);
  color: var(--core-ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.8em;
  text-align: center;
  padding: 4%;
  animation: popIn 460ms var(--ease-out) both;
}
.orbit-core .core-icon { display: block; margin-bottom: 0.35em; }
.node-num {
  font-size: clamp(11px, 1.5cqw, 17px);
  font-weight: 900;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
/* A competency core carries an icon above its name, so it needs a little less
   type than a domain core, which is only words. */
.comp-ring .orbit-core .core-title { font-size: clamp(13px, 2.4cqw, 26px); }

.orbit-core .core-title {
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.05em;
  line-height: 0.92;
  font-size: clamp(15px, 2.7cqw, 36px);
  max-width: 78%;
}
.orbit-core .core-kicker {
  font-size: clamp(9.5px, 1.2cqw, 14px);
  font-weight: 700;
  line-height: 1.3;
  color: var(--core-sub);
  max-width: 72%;
}

.orbit-node {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 9.2%;
  aspect-ratio: 1;
  border-radius: 999px;
  border: 0;
  padding: 0;
  cursor: pointer;
  display: grid;
  place-items: center;
  background: var(--fill);
  color: var(--node-ink);
  /* A paper ring first, then the tinted halo: without it the peach disc
     disappears into the peach core, and the red one into the navy. */
  box-shadow: 0 0 0 0.32cqw var(--paper), 0 0 0 1.1cqw var(--halo);
  animation: orbitIn 500ms var(--ease-out) both;
  transition: box-shadow 200ms var(--ease-out), opacity 160ms ease;
  z-index: 2;
}
.orbit-node svg { width: 56%; height: 56%; }

.orbit-chip {
  position: absolute;
  width: 21%;
  border: 0;
  cursor: pointer;
  text-align: center;
  border-radius: 999px;
  padding: 1.15cqw 1.4cqw;
  background: var(--fill);
  color: var(--chip-ink);
  animation: chipIn 460ms var(--ease-out) both;
  transition: transform 180ms var(--ease-out), box-shadow 180ms var(--ease-out), opacity 160ms ease;
}
.orbit-chip[data-side='left'] { transform: translate(-100%, -50%); }
.orbit-chip[data-side='right'] { transform: translate(0, -50%); }
.orbit-chip[data-side='top'] { transform: translate(-50%, -100%); }

/* A pointer on the chip's inner edge, aimed back down the spoke at its disc —
   the detail that makes which chip belongs to which icon unambiguous. */
.orbit-chip::after {
  content: '';
  position: absolute;
  width: 1.3cqw;
  height: 1.3cqw;
  min-width: 9px;
  min-height: 9px;
  background: var(--fill);
  transform: rotate(45deg);
  border-radius: 2px;
}
.orbit-chip[data-side='left']::after { right: -0.55cqw; top: 50%; margin-top: -0.65cqw; }
.orbit-chip[data-side='right']::after { left: -0.55cqw; top: 50%; margin-top: -0.65cqw; }
.orbit-chip[data-side='top']::after { bottom: -0.55cqw; left: 50%; margin-left: -0.65cqw; }

.orbit-chip .chip-name {
  display: block;
  font-size: clamp(10.5px, 1.42cqw, 16px);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.015em;
  line-height: 1.1;
}

@media (hover: hover) and (pointer: fine) {
  .orbit-chip[data-side='left']:hover { transform: translate(-100%, -50%) scale(1.04); box-shadow: var(--shadow-md); }
  .orbit-chip[data-side='right']:hover { transform: translate(0, -50%) scale(1.04); box-shadow: var(--shadow-md); }
  .orbit-chip[data-side='top']:hover { transform: translate(-50%, -100%) scale(1.04); box-shadow: var(--shadow-md); }
  .orbit-node:hover { box-shadow: 0 0 0 0.32cqw var(--paper), 0 0 0 1.7cqw var(--halo); }
}

/* ---------- The menu -------------------------------------------------------
   A drawer rather than a page, so opening it never costs you your place; and
   it lists all thirty behaviours' worth of structure, so nobody has to
   navigate backwards through the diagram to change subject.
   ------------------------------------------------------------------------- */

.menu-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.09);
  border: 0;
  border-radius: 999px;
  padding: 9px 16px 9px 13px;
  margin-right: 16px;
  color: #fff;
  cursor: pointer;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  transition: background-color 160ms ease;
}
.menu-btn:hover { background: rgba(255, 255, 255, 0.17); }
.mb-bars { display: flex; flex-direction: column; gap: 3.5px; width: 16px; }
.mb-bars i { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 220ms var(--ease-out), opacity 160ms ease; }
.mb-bars i:nth-child(2) { width: 68%; }
.menu-btn[aria-expanded='true'] .mb-bars i:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
.menu-btn[aria-expanded='true'] .mb-bars i:nth-child(2) { opacity: 0; }
.menu-btn[aria-expanded='true'] .mb-bars i:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }

.dw-backdrop {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(21, 7, 33, 0.44);
  animation: fadeIn 200ms ease both;
}
@keyframes fadeIn { from { opacity: 0; } }
@keyframes slideIn { from { transform: translateX(-100%); } }

/* ---------- How-to line ----------------------------------------------------
   The same shape on every screen: a quiet, one-sentence "what do I do here".
   ------------------------------------------------------------------------- */

.howto {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin: 0 0 20px;
  padding: 10px 14px;
  border: 1px solid var(--rule);
  border-radius: 11px;
  background: var(--wash);
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink-mid);
}
.howto svg {
  flex: none;
  margin-top: 2px;
  color: var(--ink-soft);
  align-self: flex-start;
  margin-top: 3px;
}
.howto > span {
  flex: 1 1 340px;
}
.howto b {
  color: var(--ink);
  font-weight: 700;
}
.howto-cta {
  flex: none;
  margin-left: auto;
}

/* ---------- The tour -------------------------------------------------------
   A blocker to stop stray clicks, a spotlight that dims everything but the
   target, and a card that flips above or below depending on the room.
   ------------------------------------------------------------------------- */

.tour-block {
  position: fixed;
  inset: 0;
  z-index: 300;
}
.tour-block[data-dim='true'] {
  background: rgba(21, 7, 33, 0.62);
}
.tour-spot {
  position: fixed;
  z-index: 301;
  border-radius: 14px;
  pointer-events: none;
  box-shadow: 0 0 0 9999px rgba(21, 7, 33, 0.62);
  outline: 2px solid rgba(255, 255, 255, 0.92);
}
.tour-spot[hidden] { display: none; }

.tour-card {
  position: fixed;
  z-index: 302;
  width: min(370px, calc(100vw - 24px));
  padding: 20px 22px 18px;
  border-radius: 14px;
  background: var(--paper);
  box-shadow: 0 18px 50px rgba(21, 7, 33, 0.3);
  animation: fadeIn 200ms ease both;
}
.tour-card[data-center='true'] {
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(440px, calc(100vw - 24px));
}
.tc-count {
  display: block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.tour-card h2 {
  margin: 8px 0 8px;
  font-size: 20px;
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -0.01em;
}
.tour-card p {
  margin: 0 0 18px;
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--ink-mid);
}
.tc-nav {
  display: flex;
  align-items: center;
  gap: 10px;
}
.tc-skip {
  margin-left: auto;
  border: 0;
  background: none;
  padding: 6px 2px;
  font: inherit;
  font-size: 13px;
  color: var(--ink-soft);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.tc-skip:hover { color: var(--ink); }

.confirm-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(21, 7, 33, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 150ms ease both;
}
.confirm-box {
  background: #fff;
  border-radius: 14px;
  padding: 28px 30px 22px;
  max-width: 380px;
  width: 90%;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
}
.confirm-box p {
  margin: 0 0 20px;
  font-size: 15px;
  line-height: 1.55;
  color: #1c1332;
}
.confirm-btns {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}

.drawer {
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 91;
  width: min(370px, 88vw);
  display: flex;
  flex-direction: column;
  background: var(--navy);
  color: #fff;
  animation: slideIn 300ms var(--ease-out) both;
}
.drawer :focus-visible { outline-color: var(--peach); }

.dw-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 22px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  flex-shrink: 0;
}
.dw-title { font-size: 11px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255, 255, 255, 0.5); }
.dw-close {
  width: 32px;
  height: 32px;
  border-radius: 999px;
  border: 0;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.dw-close:hover { background: #fff; color: var(--navy); }

.dw-scroll { flex: 1; overflow-y: auto; padding: 16px 14px 34px; }

.dw-link {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 12px;
  padding: 12px 12px;
  color: rgba(255, 255, 255, 0.86);
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.dw-link:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
.dw-link[aria-current='true'] { color: var(--peach); }

.dw-group { margin-top: 18px; }
.dw-domain {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  background: none;
  border: 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.14);
  padding: 0 12px 10px;
  margin-bottom: 6px;
  cursor: pointer;
  text-align: left;
  color: #fff;
}
/* Build Culture's core is navy, which is the drawer's own background, so the
   dot carries a hairline ring to keep both domains visible here. */
.dw-dot {
  width: 11px;
  height: 11px;
  border-radius: 999px;
  background: var(--core);
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.6);
  flex-shrink: 0;
}
.dw-domain-name { font-size: 13px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; }
.dw-n { margin-left: auto; font-size: 11px; font-weight: 800; color: rgba(255, 255, 255, 0.4); font-variant-numeric: tabular-nums; }
.dw-domain:hover .dw-domain-name { color: var(--peach); }

.dw-comps { display: flex; flex-direction: column; gap: 1px; }
.dw-comp {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  background: none;
  border: 0;
  border-radius: 12px;
  padding: 8px 12px;
  cursor: pointer;
  text-align: left;
  color: rgba(255, 255, 255, 0.84);
}
.dw-badge {
  width: 27px;
  height: 27px;
  border-radius: 999px;
  background: var(--fill);
  color: var(--node-ink);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.dw-comp-name { font-size: 14.5px; font-weight: 700; letter-spacing: -0.015em; }
.dw-comp:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
.dw-comp[aria-current='true'] { background: rgba(255, 255, 255, 0.13); color: #fff; }

.dw-sec { margin-top: 26px; padding: 0 12px; }
.dw-label { display: block; font-size: 10px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255, 255, 255, 0.42); }
.dw-note { margin-top: 7px; font-size: 12.5px; line-height: 1.5; color: rgba(255, 255, 255, 0.55); }
.dw-sec .dw-link { margin: 8px -12px 0; width: calc(100% + 24px); }

.dw-lenses { display: flex; flex-direction: column; gap: 5px; margin: 11px -12px 0; }
.dw-lens {
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: none;
  border: 0;
  border-left: 3px solid var(--lens-dot);
  border-radius: 0 12px 12px 0;
  padding: 9px 12px;
  cursor: pointer;
  text-align: left;
  color: rgba(255, 255, 255, 0.8);
}
.dw-lens:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
.dw-lens[aria-pressed='true'] { background: rgba(255, 255, 255, 0.14); color: #fff; }
.dw-lens-name { font-size: 14.5px; font-weight: 800; letter-spacing: -0.015em; }
.dw-lens-sub { font-size: 11.5px; color: rgba(255, 255, 255, 0.55); }
.dw-lens[aria-pressed='true'] .dw-lens-sub { color: rgba(255, 255, 255, 0.72); }

/* ---------- Search -------------------------------------------------------- */

.searchbar { position: relative; margin-bottom: 30px; max-width: 560px; }
.searchbar input {
  width: 100%;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 14px 44px 14px 20px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  font-weight: 500;
  outline: none;
  transition: border-color 140ms ease;
}
.searchbar input::placeholder { color: var(--ink-soft); }
.searchbar input:focus { border-color: var(--ink); }
.searchbar .clear {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: 0;
  cursor: pointer;
  color: var(--ink-soft);
  font-size: 18px;
  line-height: 1;
  padding: 8px;
}
.searchbar .clear:hover { color: var(--ink); }

.results { display: flex; flex-direction: column; gap: 8px; max-width: 780px; }
.result {
  display: flex;
  gap: 14px;
  align-items: center;
  text-align: left;
  width: 100%;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 16px;
  padding: 14px 18px;
  cursor: pointer;
  transition: border-color 160ms ease;
}
.result .r-badge {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  border-radius: 999px;
  background: var(--fill);
  color: var(--node-ink);
  display: grid;
  place-items: center;
}
.result .r-comp { font-size: 10px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
.result h4 { font-size: 15.5px; font-weight: 800; letter-spacing: -0.015em; margin: 2px 0; }
.result p { font-size: 14px; color: var(--ink-mid); line-height: 1.5; }
.result mark { background: var(--lime); color: var(--ink); border-radius: 3px; padding: 0 2px; }
@media (hover: hover) and (pointer: fine) { .result:hover { border-color: rgba(21, 7, 33, 0.3); } }

.empty { padding: 50px 0; color: var(--ink-soft); font-size: 15px; }

/* ---------- Level rungs (shared by the dialog) ---------------------------- */

.rung {
  text-align: left;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 14px;
  padding: 13px 16px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: border-color 160ms ease, background-color 160ms ease, transform 160ms var(--ease-out);
}
.rung:active { transform: scale(0.995); }
.rung-name {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.rung-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
.rung-exp { font-size: 14.5px; color: var(--ink-mid); line-height: 1.5; }
.rung[data-current='true'] { border-color: var(--ink); background: var(--wash); }
.rung[data-current='true'] .rung-name, .rung[data-current='true'] .rung-exp { color: var(--ink); }
@media (hover: hover) and (pointer: fine) { .rung:hover { border-color: rgba(21, 7, 33, 0.32); } }

/* ---------- Zoom 3: behaviour --------------------------------------------- */

.beh-hero { margin-bottom: 26px; }
.beh-hero .bh-trail { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.beh-hero .bh-badge {
  width: 32px;
  height: 32px;
  border-radius: 999px;
  background: var(--fill);
  color: var(--node-ink);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.beh-hero .bh-link {
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.beh-hero .bh-link:hover { color: var(--ink); }
.beh-hero h1 { font-size: clamp(32px, 5vw, 48px); margin: 16px 0 0; }
.beh-hero .def { margin-top: 14px; max-width: 66ch; font-size: 17px; font-weight: 500; color: var(--ink-mid); line-height: 1.6; }

.expectation {
  border-radius: 20px;
  padding: 26px 28px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-left: 6px solid var(--accent);
  margin-bottom: 20px;
}
.expectation p {
  margin-top: 10px;
  font-size: clamp(18px, 2.3vw, 23px);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.32;
  max-width: 46ch;
}

.note {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 14px;
  padding: 13px 16px;
  margin-bottom: 26px;
  font-size: 13.5px;
  color: var(--ink-mid);
  line-height: 1.55;
}
.note .flag { width: 4px; align-self: stretch; border-radius: 3px; background: var(--ink-soft); flex-shrink: 0; }
.note b { color: var(--ink); }

.rating-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rating-card {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 18px;
  padding: 20px;
  animation: popIn 300ms var(--ease-out) both;
}
.rating-card:nth-child(2) { animation-delay: 55ms; }
.rating-card:nth-child(3) { animation-delay: 110ms; }
.rating-card p { font-size: 14.5px; color: var(--ink-mid); line-height: 1.6; }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 13px 6px 9px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 12px;
  background: var(--wash-deep);
  color: var(--ink);
}
.tag::before { content: ''; width: 9px; height: 9px; border-radius: 999px; background: var(--tag-color); }
.tag[data-r='needs-work'] { --tag-color: var(--red); }
.tag[data-r='great'] { --tag-color: var(--lime); }
.tag[data-r='smashing-it'] { --tag-color: var(--yellow); }

.pager { display: flex; justify-content: space-between; gap: 14px; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--rule); }
.pager button { background: none; border: 0; cursor: pointer; text-align: left; padding: 10px 0; max-width: 46%; }
.pager button:disabled { opacity: 0.26; cursor: default; }
.pager .pg-dir { font-size: 10px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
.pager .pg-name { display: block; margin-top: 4px; font-size: 16px; font-weight: 800; letter-spacing: -0.015em; }
.pager button:hover:not(:disabled) .pg-name { text-decoration: underline; }
.pager .next { text-align: right; margin-left: auto; }

/* ---------- Forms --------------------------------------------------------- */

.field { margin-bottom: 20px; }
.field > label {
  display: block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 9px;
}
.field input[type='text'], .field input[type='date'], .field textarea {
  width: 100%;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 14px;
  padding: 15px 18px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  font-weight: 500;
  outline: none;
  transition: border-color 140ms ease;
}
.field textarea { resize: vertical; min-height: 92px; line-height: 1.55; }
.field input:focus, .field textarea:focus { border-color: var(--ink); }
.field .hint { margin-top: 8px; font-size: 13px; color: var(--ink-soft); }

.choice-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.choice {
  text-align: left;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 16px;
  padding: 16px 18px;
  cursor: pointer;
  transition: border-color 160ms ease, transform 160ms var(--ease-out);
}
.choice:active { transform: scale(0.99); }
.choice b { display: flex; align-items: center; gap: 8px; font-size: 15.5px; font-weight: 800; letter-spacing: -0.015em; }
.choice b::before { content: ''; width: 9px; height: 9px; border-radius: 999px; background: var(--accent, var(--rule)); }
.choice span { display: block; margin-top: 4px; font-size: 13px; color: var(--ink-mid); line-height: 1.45; }
.choice[aria-pressed='true'] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
@media (hover: hover) and (pointer: fine) { .choice:hover { border-color: rgba(21, 7, 33, 0.3); } }

/* ---------- Assessment steps ---------------------------------------------- */

.progress-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.progress-head .ph-left { display: flex; gap: 14px; align-items: center; }
.progress-head .ph-badge {
  width: 52px;
  height: 52px;
  border-radius: 999px;
  background: var(--fill);
  color: var(--node-ink);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.progress-head .micro { color: var(--ink-soft); }
.track { height: 5px; background: var(--wash-deep); border-radius: 999px; overflow: hidden; margin-bottom: 30px; }
.track .fill { height: 100%; background: var(--navy); border-radius: 999px; transition: width 400ms var(--ease-out); }

.q-block { border-top: 1px solid var(--rule); padding: 26px 0; animation: fadeUp 300ms var(--ease-out) both; }
.q-block:nth-child(2) { animation-delay: 50ms; }
.q-block:nth-child(3) { animation-delay: 100ms; }
.q-block h3 { font-size: 21px; font-weight: 800; letter-spacing: -0.025em; }
.q-block .q-def { margin-top: 6px; font-size: 14.5px; color: var(--ink-mid); max-width: 68ch; }
.q-expect { margin: 15px 0 16px; padding: 14px 16px; border-radius: 14px; background: var(--paper); border: 1px solid var(--rule); border-left: 5px solid var(--lvl); }
.q-expect span { font-size: 10px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
.q-expect p { margin-top: 5px; font-size: 15px; font-weight: 700; line-height: 1.48; }

.opt-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.opt {
  text-align: left;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 16px;
  padding: 16px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: border-color 160ms ease, transform 160ms var(--ease-out), box-shadow 160ms ease;
}
.opt:active { transform: scale(0.99); }
.opt .opt-tag {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  align-self: flex-start;
  padding: 5px 12px 5px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  background: var(--wash-deep);
  color: var(--ink-mid);
}
.opt .opt-tag::before { content: ''; width: 9px; height: 9px; border-radius: 999px; background: var(--r-color); }
.opt p { font-size: 13.5px; color: var(--ink-mid); line-height: 1.55; }
.opt[aria-pressed='true'] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.opt[aria-pressed='true'] .opt-tag { background: var(--ink); color: #fff; }
.opt[aria-pressed='true'] p { color: var(--ink); }
@media (hover: hover) and (pointer: fine) { .opt:hover { border-color: rgba(21, 7, 33, 0.32); } }

.step-nav { display: flex; gap: 12px; align-items: center; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.step-nav .spacer { margin-left: auto; }
.step-dots { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.step-dots .dot-gap { width: 12px; }
.step-dot { width: 20px; height: 5px; border-radius: 999px; border: 0; padding: 0; cursor: pointer; background: var(--rule); transition: background-color 160ms ease, transform 160ms var(--ease-out); }
.step-dot[data-done='true'] { background: var(--ink-soft); }
.step-dot[aria-current='true'] { background: var(--navy); transform: scaleY(1.6); }

/* ---------- Report -------------------------------------------------------- */

.gauge { position: relative; display: grid; place-items: center; width: var(--gauge-size); height: var(--gauge-size); flex-shrink: 0; }
.gauge svg { width: 100%; height: 100%; }
.gauge .g-track { fill: none; stroke: var(--wash-deep); stroke-width: 9; }
.gauge .g-fill { fill: none; stroke-width: 9; stroke-linecap: round; animation: gaugeIn 1s var(--ease-out) both; }
.gauge .g-tick { stroke: rgba(21, 7, 33, 0.4); stroke-width: 2.5; stroke-linecap: round; }
.gauge .g-value {
  position: absolute;
  font-size: calc(var(--gauge-size) * 0.28);
  font-weight: 900;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.gauge .g-value small { font-size: 0.42em; font-weight: 700; color: var(--ink-soft); }

.rpt-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }

.rpt-head {
  display: flex;
  gap: 30px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 24px;
  padding: 30px 32px;
  margin-bottom: 14px;
}
.rpt-head h1 { font-size: clamp(30px, 4.4vw, 42px); margin: 12px 0 4px; }
.rh-sub { font-size: 16px; font-weight: 700; color: var(--ink-mid); }
.rh-meta { display: flex; gap: 26px; flex-wrap: wrap; margin-top: 18px; }
.rh-meta div span { display: block; font-size: 10px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
.rh-meta div b { font-size: 15px; font-weight: 800; }
.rh-gauge { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.rh-band { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }

.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 30px; }
.count { background: var(--paper); border: 1px solid var(--rule); border-radius: 16px; padding: 15px 18px; }
.count .c-dot { display: block; width: 10px; height: 10px; border-radius: 999px; margin-bottom: 9px; }
.count b { display: block; font-size: 30px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.count span { display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin-top: 2px; }

.dpanels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 30px; }
.dpanel { background: var(--paper); border: 1px solid var(--rule); border-radius: 22px; padding: 24px; }
.dp-head { display: flex; gap: 18px; align-items: center; margin-bottom: 20px; }
.dp-head h3 { font-size: 19px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.025em; margin-top: 6px; }
.dp-head p { font-size: 13px; color: var(--ink-mid); margin-top: 3px; }
.dp-scores { display: flex; flex-direction: column; gap: 9px; }

.score-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(90px, 210px) 38px; gap: 16px; align-items: center; }
.sr-name { font-size: 14px; font-weight: 700; }
.sr-bar { position: relative; height: 8px; background: var(--wash-deep); border-radius: 999px; overflow: hidden; }
.sr-mark { position: absolute; left: 66.6%; top: 0; bottom: 0; width: 1px; background: rgba(21, 7, 33, 0.3); z-index: 2; }
.sr-fill { display: block; height: 100%; border-radius: 999px; transform-origin: left center; animation: growBar 900ms var(--ease-out) both; }
.sr-score { text-align: right; font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

.findings { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 30px; }
.find { background: var(--paper); border: 1px solid var(--rule); border-radius: 22px; padding: 24px; }
.find h2, .det h2 { font-size: 17px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; margin-bottom: 10px; }
.find-lede, .find-none { font-size: 14px; color: var(--ink-mid); line-height: 1.55; margin-bottom: 14px; }
.find-list { display: flex; flex-direction: column; gap: 12px; }
.find-list li { display: flex; gap: 12px; align-items: flex-start; }
.fl-n {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 999px;
  background: var(--navy);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 11.5px;
  font-weight: 800;
  margin-top: 2px;
}
.fl-n[data-plain='true'] { background: none; border: 2px solid var(--lime); width: 14px; height: 14px; margin-top: 6px; }
.find-list b { font-size: 14.5px; font-weight: 800; letter-spacing: -0.015em; }
.fl-comp { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); display: block; margin-top: 1px; }
.find-list p { font-size: 13.5px; color: var(--ink-mid); line-height: 1.5; margin-top: 4px; }

.det { background: var(--paper); border: 1px solid var(--rule); border-radius: 22px; padding: 26px; }
.det-driver { margin-top: 26px; }
.det-driver:first-of-type { margin-top: 16px; }
.det-driver-name {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}
.det-driver-name .dg-mark { width: 14px; height: 14px; border-radius: 999px; background: var(--core); flex-shrink: 0; }
.detail-comp { margin-top: 18px; }
.dc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; }
.dc-name { font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; }
.dc-score { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink-soft); }

/* Two ring geometries: five satellites around a domain, three around a

/* Polar to percentage-of-box. A vertical offset given in width units has to be
   restated as a percentage of the height, hence the aspect correction. */
function polar(geo, angle, radius) {
  const a = (angle * Math.PI) / 180;
  return {

    y: geo.core.y - radius * Math.sin(a) * (geo.box.w / geo.box.h),

}
