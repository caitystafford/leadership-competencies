ctive working relationships.","levels":{"foundations":{"expectation":"Listens with empathy, raises issues early, and seeks support to resolve them.","ratings":{"needs-work":"Avoids tension, lets issues build, reacts emotionally, or discusses the problem with others rather than addressing it appropriately.","great":"Listens with empathy, raises issues early, and seeks support to resolve them.","smashing-it":"Raises concerns respectfully, listens for the underlying issue, contributes to a fair resolution, and follows up to confirm the relationship and work are back on track."}},"momentum":{"expectation":"Addresses conflict directly and fairly, balancing honesty with respect to keep teams aligned and productive.","ratings":{"needs-work":"Delays difficult conversations, takes sides, or handles similar conflicts inconsistently. The issue continues to affect performance or trust.","great":"Addresses conflict directly and fairly, balancing honesty with respect to keep teams aligned and productive.","smashing-it":"Facilitates productive challenge, addresses root causes rather than symptoms, and restores clarity, accountability, and trust after conflict."}},"enterprise":{"expectation":"Creates conditions where healthy challenge is expected, conflict is addressed early, and trust is maintained across teams or functions.","ratings":{"needs-work":"Cross functional tension is tolerated, politicised, or repeatedly escalated without resolution. Structural causes are left unchanged.","great":"Creates conditions where healthy challenge is expected, conflict is addressed early, and trust is maintained across teams or functions.","smashing-it":"Builds organisational capability and mechanisms for constructive disagreement, identifies recurring conflict patterns, and changes systems that create avoidable friction."}}}},{"id":"strengthens-team-culture","name":"Strengthens team culture","definition":"Builds relationships and environments where people feel connected, supported, and able to do their best work.","levels":{"foundations":{"expectation":"Contributes positively to team relationships and ways of working.","ratings":{"needs-work":"Is passive or negative about team culture, excludes others, or behaves in ways that reduce trust, cooperation, or psychological safety.","great":"Contributes positively to team relationships and ways of working.","smashing-it":"Models inclusion, supports colleagues, reinforces useful team norms, and helps create an environment where people can contribute confidently."}},"momentum":{"expectation":"Builds trust within the team and addresses behaviours that undermine performance or inclusion.","ratings":{"needs-work":"Ignores behaviours that damage trust or inclusion, relies on informal goodwill, or allows standards to vary across the team.","great":"Builds trust within the team and addresses behaviours that undermine performance or inclusion.","smashing-it":"Deliberately shapes team rituals, standards, and feedback, and builds shared ownership for a healthy, accountable culture."}},"enterprise":{"expectation":"Builds relationships and uses organisational influence across functions to align stakeholders, resolve barriers, and deliberately shape a collaborative, high performing culture at scale.","ratings":{"needs-work":"Culture is treated as messaging, relationships are narrow, stakeholder dynamics are ignored, and cross functional barriers or political friction repeatedly undermine outcomes.","great":"Builds relationships and uses organisational influence across functions to align stakeholders, resolve barriers, and deliberately shape a collaborative, high performing culture at scale.","smashing-it":"Builds influential networks, aligns incentives and leadership systems, measures culture drivers, and mobilises stakeholders across boundaries around shared outcomes."}}}}]},{"id":"perseverance","name":"Perseverance","behaviours":[{"id":"keeps-going","name":"Keeps going","definition":"Pushes through challenges and keeps things moving, even when the next step isn’t obvious.","levels":{"foundations":{"expectation":"Pushes through setbacks and follows things through to the end.","ratings":{"needs-work":"Gives up too quickly, loses focus after setbacks, or leaves work unfinished when the path becomes difficult or unclear.","great":"Pushes through setbacks and follows things through to the end.","smashing-it":"Stays steady, adjusts the plan when needed, seeks help early, and closes the loop even when the work becomes difficult."}},"momentum":{"expectation":"Balances focus with flexibility when priorities shift.","ratings":{"needs-work":"Becomes rigid or reactive when priorities change. The team experiences confusion, unnecessary churn, or loss of momentum.","great":"Balances focus with flexibility when priorities shift.","smashing-it":"Helps the team reprioritise calmly, protects essential outcomes, and adapts the plan without losing accountability or creating avoidable disruption."}},"enterprise":{"expectation":"Sustains momentum through prolonged complexity or uncertainty and prevents disruption to performance at scale.","ratings":{"needs-work":"Prolonged complexity creates strategic drift, reactive decisions, or sustained overload. Performance depends on repeated crisis responses.","great":"Sustains momentum through prolonged complexity or uncertainty and prevents disruption to performance at scale.","smashing-it":"Anticipates pressure points, sequences decisions deliberately, protects organisational capacity, and preserves strategic focus through extended uncertainty."}}}},{"id":"lifts-others","name":"Lifts others","definition":"Provides steadiness and confidence to others, especially during pressure or uncertainty.","levels":{"foundations":{"expectation":"Stays positive and encourages teammates.","ratings":{"needs-work":"Passes stress to others, focuses mainly on what is going wrong, or withdraws support when pressure increases.","great":"Stays positive and encourages teammates.","smashing-it":"Notices when others are struggling, offers practical support, and recognises progress without minimising genuine challenges."}},"momentum":{"expectation":"Builds belief in others and celebrates progress.","ratings":{"needs-work":"Motivation is inconsistent or relies on generic encouragement. Pressure reduces confidence, ownership, or energy across the team.","great":"Builds belief in others and celebrates progress.","smashing-it":"Builds confidence through clear context, coaching, recognition, and meaningful ownership, especially when results are difficult."}},"enterprise":{"expectation":"Creates stability and focus through visible leadership during sustained pressure or change.","ratings":{"needs-work":"Leadership is invisible or inconsistent during major change. Messages lack credibility or fail to create confidence and focus.","great":"Creates stability and focus through visible leadership during sustained pressure or change.","smashing-it":"Sustains confidence across the business through transparent communication, visible decisions, practical support systems, and consistent leadership behaviour."}}}},{"id":"finds-a-way","name":"Finds a way","definition":"Removes obstacles and adapts approaches to keep progress moving.","levels":{"foundations":{"expectation":"Looks for ways around small roadblocks.","ratings":{"needs-work":"Waits for someone else to solve routine obstacles, repeats an approach that is not working, or stops without escalating appropriately.","great":"Looks for ways around small roadblocks.","smashing-it":"Tests practical alternatives, uses available resources, escalates with useful context, and shares solutions that may help others."}},"momentum":{"expectation":"Removes obstacles so the team can keep moving.","ratings":{"needs-work":"Accepts barriers as fixed, removes only immediate symptoms, or allows recurring obstacles to consume team time and energy.","great":"Removes obstacles so the team can keep moving.","smashing-it":"Coordinates resources, addresses root causes, and improves processes so the same barrier is less likely to recur."}},"enterprise":{"expectation":"Anticipates systemic barriers and reshapes conditions so progress can continue across teams, functions, or markets.","ratings":{"needs-work":"Systemic barriers remain in place while teams rely on local workarounds. Constraints are shifted between functions rather than resolved.","great":"Anticipates systemic barriers and reshapes conditions so progress can continue across teams, functions, or markets.","smashing-it":"Redesigns structures, policies, or investment decisions to remove systemic constraints and tracks whether progress improves without creating new barriers elsewhere."}}}}]},{"id":"potential","name":"Potential","behaviours":[{"id":"asks-and-explores","name":"Asks and explores","definition":"Uses curiosity, questions, insight, and external perspective to understand the bigger picture and explore what is possible.","levels":{"foundations":{"expectation":"Seeks to understand by asking questions and testing ideas.","ratings":{"needs-work":"Assumes, relies on the first answer, or asks questions without using the information.","great":"Seeks relevant perspectives and tests assumptions before acting.","smashing-it":"Identifies emerging patterns, connects insight across areas and creates better questions for others."}},"momentum":{"expectation":"Shares insights and connects dots to improve work.","ratings":{"needs-work":"Works within a narrow view, shares observations without turning them into action, or overlooks useful links between information and operational issues.","great":"Shares insights and connects dots to improve work.","smashing-it":"Synthesises data, experience, and stakeholder input to identify patterns and convert insight into practical improvements."}},"enterprise":{"expectation":"Scans customer, market, regulatory, technology, and emerging business trends to identify future risks and opportunities and inform strategic choices.","ratings":{"needs-work":"Focuses mainly on internal historical information. Customer, market, regulatory, technology, or competitor shifts are noticed too late.","great":"Scans customer, market, regulatory, technology, and emerging business trends to identify future risks and opportunities and inform strategic choices.","smashing-it":"Creates systematic horizon scanning and experimentation, challenges strategic assumptions, and converts weak signals into clear choices, scenarios, and investment decisions."}}}},{"id":"challenges-the-norm","name":"Challenges the norm","definition":"Questions assumptions and existing practices to find better ways forward.","levels":{"foundations":{"expectation":"Brings fresh thinking and voices ideas that could make things better.","ratings":{"needs-work":"Accepts inefficient practice, complains without proposing a solution, or avoids raising concerns.","great":"Constructively questions processes and suggests practical improvements.","smashing-it":"Leads thoughtful challenge to entrenched practices and helps others test better ways of working."}},"momentum":{"expectation":"Tests assumptions and takes smart risks to spark progress.","ratings":{"needs-work":"Challenges inconsistently, takes unnecessary risks, or introduces change without a clear hypothesis, stakeholder support, or learning plan.","great":"Tests assumptions and takes smart risks to spark progress.","smashing-it":"Frames clear hypotheses, builds support, runs controlled tests, and scales or stops ideas based on evidence."}},"enterprise":{"expectation":"Challenges entrenched thinking and redirects effort or investment to improve future outcomes at scale.","ratings":{"needs-work":"Protects the status quo despite evidence, or drives large change without sufficient analysis of value, risk, and organisational capacity.","great":"Challenges entrenched thinking and redirects effort or investment to improve future outcomes at scale.","smashing-it":"Builds a disciplined portfolio of change, stops low value work, reallocates resources decisively, and measures whether strategic outcomes improve."}}}},{"id":"learns-and-adapts","name":"Learns and adapts","definition":"Uses feedback, reflection, experimentation, and learning to understand their impact and adapt how they work.","levels":{"foundations":{"expectation":"Seeks feedback, recognises strengths and development gaps, and applies learning to improve.","ratings":{"needs-work":"Repeats ineffective approaches, resists feedback or treats setbacks as someone else's issue.","great":"Seeks feedback, applies learning and changes approach when evidence requires it.","smashing-it":"Builds learning loops for others and adapts direction early in response to new information."}},"momentum":{"expectation":"Reflects on their impact, adapts their leadership approach, and models continuous learning for the team.","ratings":{"needs-work":"Defends their usual approach, reacts poorly to feedback, or expects the team to adapt while their own behaviour remains unchanged.","great":"Reflects on their impact, adapts their leadership approach, and models continuous learning for the team.","smashing-it":"Creates regular reflection and feedback loops, adapts style to people and context, and normalises experimentation and learning from mistakes."}},"enterprise":{"expectation":"Builds an adaptive learning culture, tests strategic assumptions, and evolves leadership practices as conditions change.","ratings":{"needs-work":"Leadership practices remain fixed despite changing conditions, feedback is filtered, or failed assumptions are defended rather than examined.","great":"Builds an adaptive learning culture, tests strategic assumptions, and evolves leadership practices as conditions change.","smashing-it":"Builds enterprise feedback and learning loops, changes course early when evidence shifts, and models visible unlearning that increases organisational adaptability."}}}}]},{"id":"equity","name":"Equity","behaviours":[{"id":"values-differences","name":"Values differences","definition":"Respects diverse backgrounds, experiences, and perspectives to create inclusive teams where everyone can contribute.","levels":{"foundations":{"expectation":"Is respectful of others’ views, even when different from their own.","ratings":{"needs-work":"Dismisses, interrupts, or excludes different perspectives, or becomes defensive when others challenge their view.","great":"Is respectful of others’ views, even when different from their own.","smashing-it":"Actively seeks different perspectives, changes their view when evidence supports it, and helps others contribute safely and confidently."}},"momentum":{"expectation":"Invites different perspectives to broaden thinking and decisions.","ratings":{"needs-work":"Consults the same voices, treats inclusion as a formality, or gathers input without allowing it to influence the decision.","great":"Invites different perspectives to broaden thinking and decisions.","smashing-it":"Designs inclusive decision processes, addresses bias or unequal participation, and shows how diverse input improved the outcome."}},"enterprise":{"expectation":"Builds environments where diverse perspectives are actively used to improve decision quality and reduce bias at scale.","ratings":{"needs-work":"Diversity is treated symbolically rather than embedded in governance, talent, strategy, or decision processes.","great":"Builds environments where diverse perspectives are actively used to improve decision quality and reduce bias at scale.","smashing-it":"Embeds diverse input into governance, data, workforce, and strategic decisions, and measures whether decision quality and equity outcomes improve."}}}},{"id":"makes-ethical-decisions","name":"Makes ethical decisions","definition":"Uses integrity and sound judgement to do what is right, even when choices are complex or uncomfortable.","levels":{"foundations":{"expectation":"Acts with integrity and checks decisions align with our standards.","ratings":{"needs-work":"Ignores standards, hides concerns, takes convenient shortcuts, or proceeds despite uncertainty without checking what is right.","great":"Acts with integrity and checks decisions align with our standards.","smashing-it":"Identifies conflicts early, seeks appropriate advice, documents the rationale, and speaks up when a decision may not meet the organisation’s standards."}},"momentum":{"expectation":"Navigates grey areas using judgement, facts, and values.","ratings":{"needs-work":"Applies values inconsistently in grey areas or allows delivery pressure, relationships, or personal preference to override sound judgement.","great":"Navigates grey areas using judgement, facts, and values.","smashing-it":"Creates a transparent decision process, balances evidence and values, and helps others make principled decisions without avoiding accountability."}},"enterprise":{"expectation":"Sets ethical boundaries for the business and supports leaders to make principled decisions under pressure and uncertainty.","ratings":{"needs-work":"Ethical boundaries and escalation paths are unclear, or exceptions are normalised when pressure increases.","great":"Sets ethical boundaries for the business and supports leaders to make principled decisions under pressure and uncertainty.","smashing-it":"Embeds ethical governance, tests the broader consequences of decisions, learns from near misses, and maintains integrity when the commercial pressure is highest."}}}},{"id":"shows-empathy","name":"Shows empathy","definition":"Considers the human impact of decisions and leads with care and respect.","levels":{"foundations":{"expectation":"Shows empathy, listens without judgement, and includes others in daily interactions.","ratings":{"needs-work":"Interrupts, judges, overlooks personal impact, or responds in a way that makes others less willing to speak openly.","great":"Shows empathy, listens without judgement, and includes others in daily interactions.","smashing-it":"Listens for what is said and unsaid, adapts support to the person, and checks whether the interaction led to a respectful and useful outcome."}},"momentum":{"expectation":"Adapts behaviour to meet people where they are, ensuring diverse perspectives shape team decisions.","ratings":{"needs-work":"Uses a one size fits all approach, or shows empathy without maintaining clear standards, accountability, and fair treatment.","great":"Adapts behaviour to meet people where they are, ensuring diverse perspectives shape team decisions.","smashing-it":"Balances care, clarity, and accountability, and ensures team decisions reflect the genuine needs and perspectives of affected people."}},"enterprise":{"expectation":"Balances empathy with accountability, ensuring decisions are fair, humane, and sustainable across teams or communities.","ratings":{"needs-work":"Major decisions are detached from human impact or produce uneven consequences that are identified only after implementation.","great":"Balances empathy with accountability, ensuring decisions are fair, humane, and sustainable across teams or communities.","smashing-it":"Uses impact assessment and stakeholder feedback to design humane, sustainable decisions, and acts early where outcomes are unfair or disproportionately harmful."}}}}]},{"id":"people","name":"People","behaviours":[{"id":"leads-the-employee-lifecycle","name":"Leads the employee lifecycle","definition":"Brings people into the business, supports them to succeed, and manages transitions well.","levels":{"foundations":{"expectation":"Understands the stages of the lifecycle and supports basic processes where directed.","ratings":{"needs-work":"Has limited awareness of lifecycle requirements, misses process steps, or provides poor handovers during onboarding, development, or transition activities.","great":"Understands the stages of the lifecycle and supports basic processes where directed.","smashing-it":"Prepares well, completes lifecycle tasks accurately and on time, and helps people understand what to expect during key transitions."}},"momentum":{"expectation":"Manages hiring, onboarding, development, and exits to maintain team stability and capability.","ratings":{"needs-work":"Hiring, onboarding, development, or exit practices are inconsistent and create avoidable capability, experience, or compliance gaps.","great":"Manages hiring, onboarding, development, and exits to maintain team stability and capability.","smashing-it":"Uses feedback and people data to improve lifecycle quality, addresses recurring experience or capability gaps, and plans transitions before they become disruptive."}},"enterprise":{"expectation":"Designs and improves people practices and workforce planning to support sustainable capability across the business.","ratings":{"needs-work":"Workforce planning is reactive and people practices are fragmented across the business. Future capability needs are not translated into action.","great":"Designs and improves people practices and workforce planning to support sustainable capability across the business.","smashing-it":"Anticipates future skills and workforce shifts, integrates talent and workforce planning, and measures whether people practices improve capability, mobility, and sustainability."}}}},{"id":"builds-capability","name":"Builds capability","definition":"Develops the skills and confidence people need to perform now and into the future.","levels":{"foundations":{"expectation":"Shares knowledge, gives useful feedback, and supports others to build confidence in core skills.","ratings":{"needs-work":"Holds knowledge, gives vague or unhelpful feedback, or takes over tasks rather than supporting others to learn.","great":"Shares knowledge, gives useful feedback, and supports others to build confidence in core skills.","smashing-it":"Explains and demonstrates skills clearly, creates safe practice, checks understanding, and helps colleagues become more independent."}},"momentum":{"expectation":"Coaches others, gives clear feedback, and builds capability within the team.","ratings":{"needs-work":"Provides limited coaching, unclear feedback, or relies on personally fixing problems rather than building team capability.","great":"Coaches others, gives clear feedback, and builds capability within the team.","smashing-it":"Tailors coaching to individual needs, creates deliberate practice, tracks development over time, and increases independent performance across the team."}},"enterprise":{"expectation":"Builds long term capability through succession planning, role design, and development pathways at scale.","ratings":{"needs-work":"Capability planning is disconnected from strategy, succession depth is weak, and key roles depend on individual incumbents.","great":"Builds long term capability through succession planning, role design, and development pathways at scale.","smashing-it":"Links capability investment to strategic priorities, builds measurable readiness and mobility, and creates succession depth for critical future roles."}}}},{"id":"drives-engagement","name":"Drives engagement","definition":"Creates conditions where people are motivated, accountable, and committed to their work.","levels":{"foundations":{"expectation":"Contributes positively to the team and takes responsibility for own engagement.","ratings":{"needs-work":"Is consistently disengaged, cynical, or passive and places full responsibility for motivation on other people.","great":"Contributes positively to the team and takes responsibility for own engagement.","smashing-it":"Raises concerns constructively, supports team participation, and contributes energy and ownership even when conditions are not ideal."}},"momentum":{"expectation":"Builds trust, addresses disengagement, and creates a team environment where people want to perform.","ratings":{"needs-work":"Avoids signs of disengagement or relies mainly on messages, activities, or incentives without addressing the actual causes.","great":"Builds trust, addresses disengagement, and creates a team environment where people want to perform.","smashing-it":"Diagnoses engagement drivers, acts on what can be changed, follows up transparently, and strengthens both belonging and accountability."}},"enterprise":{"expectation":"Shapes leadership practices, expectations, and systems that sustain engagement across teams or functions.","ratings":{"needs-work":"Engagement is treated as an occasional survey or communication activity rather than an outcome of leadership, workload, systems, and decisions.","great":"Shapes leadership practices, expectations, and systems that sustain engagement across teams or functions.","smashing-it":"Aligns leadership routines, workload, recognition, employee voice, and systems, then uses evidence to sustain engagement through changing business conditions."}}}}]},{"id":"systems-execution","name":"Systems & Execution","behaviours":[{"id":"runs-daily-operations","name":"Runs daily operations","definition":"Ensures day to day work is planned, organised, and delivered reliably.","levels":{"foundations":{"expectation":"Follows established processes and completes operational tasks as required.","ratings":{"needs-work":"Processes are followed inconsistently, operational tasks are late or incomplete, or routine dependencies are overlooked.","great":"Follows established processes and completes operational tasks as required.","smashing-it":"Plans ahead, identifies routine dependencies, closes issues promptly, and suggests practical improvements to everyday work."}},"momentum":{"expectation":"Plans and coordinates work so the team delivers reliably and issues are addressed quickly.","ratings":{"needs-work":"Work is managed reactively, ownership is unclear, and recurring operational failures or bottlenecks are not addressed.","great":"Plans and coordinates work so the team delivers reliably and issues are addressed quickly.","smashing-it":"Creates clear operating rhythms, contingency plans, and continuous improvement routines that increase reliability and reduce avoidable escalation."}},"enterprise":{"expectation":"Designs operating rhythms and structures that enable consistent execution across teams or locations.","ratings":{"needs-work":"The operating model is fragmented and execution depends on local heroics. Similar teams or locations use incompatible rhythms and structures.","great":"Designs operating rhythms and structures that enable consistent execution across teams or locations.","smashing-it":"Simplifies and strengthens the operating model, standardises where it adds value, preserves necessary local flexibility, and measures execution reliability."}}}},{"id":"uses-systems-and-data","name":"Uses systems and data","definition":"Uses data, digital tools, systems, and information to support sound decisions and performance.","levels":{"foundations":{"expectation":"Uses required systems correctly, keeps information accurate, and uses basic data to support decisions.","ratings":{"needs-work":"Uses required systems incorrectly or inconsistently, keeps unreliable information, or ignores available data when making routine decisions.","great":"Uses required systems correctly, keeps information accurate, and uses basic data to support decisions.","smashing-it":"Maintains high data quality, uses available information to identify issues, and helps others use systems safely and correctly."}},"momentum":{"expectation":"Uses data and systems to track performance, test decisions, and improve how work is done.","ratings":{"needs-work":"Produces reports without useful interpretation, relies mainly on intuition, or changes work without tracking whether the change helped.","great":"Uses data and systems to track performance, test decisions, and improve how work is done.","smashing-it":"Combines data with operational context, tests likely causes, uses digital tools appropriately, and tracks whether changes improve performance."}},"enterprise":{"expectation":"Builds data and digital capability, adopts useful technology, and creates system discipline so decisions and performance are informed, comparable, and scalable.","ratings":{"needs-work":"Data definitions, digital practices, and system adoption vary across functions. Decisions are unreliable and technology is added without clear value or adoption.","great":"Builds data and digital capability, adopts useful technology, and creates system discipline so decisions and performance are informed, comparable, and scalable.","smashing-it":"Establishes strong data governance and decision rhythms, improves adoption, and selectively scales technology that measurably improves judgement, customer outcomes, or productivity."}}}},{"id":"prioritises-for-impact","name":"Prioritises for impact","definition":"Focuses effort on what will make the biggest difference.","levels":{"foundations":{"expectation":"Manages time and tasks to meet priorities.","ratings":{"needs-work":"Spends time on lower value activity, misses key deadlines, or does not raise conflicting priorities until delivery is already affected.","great":"Manages time and tasks to meet priorities.","smashing-it":"Clarifies what matters most, sequences work effectively, renegotiates early, and protects the outcomes with the greatest value or risk."}},"momentum":{"expectation":"Balances competing demands and reallocates effort to what matters most.","ratings":{"needs-work":"Spreads effort too thinly, changes priorities without clear trade offs, or keeps low value work active while critical outcomes slip.","great":"Balances competing demands and reallocates effort to what matters most.","smashing-it":"Uses impact, risk, and dependencies to allocate effort, stops or defers low value work, and communicates trade offs clearly."}},"enterprise":{"expectation":"Sets clear priorities and trade offs so resources are focused on the highest impact outcomes.","ratings":{"needs-work":"Strategic priorities proliferate, resources remain misaligned, and the organisation lacks the capacity to execute what has been committed.","great":"Sets clear priorities and trade offs so resources are focused on the highest impact outcomes.","smashing-it":"Links portfolio and resource decisions to strategy, revisits trade offs as conditions change, and actively stops work that no longer justifies its cost."}}}}]},{"id":"risk-safety-protection","name":"Risk, Safety & Protection","behaviours":[{"id":"follows-safety-and-compliance-standards","name":"Follows safety and compliance standards","definition":"Ensures required rules, policies, and practices are followed consistently.","levels":{"foundations":{"expectation":"Follows safety and compliance requirements in daily work.","ratings":{"needs-work":"Takes shortcuts, is unaware of required standards, or does not report uncertainty, incidents, or non compliance promptly.","great":"Follows safety and compliance requirements in daily work.","smashing-it":"Models the standards, checks when unsure, raises concerns early, and helps others understand the safe and compliant way to work."}},"momentum":{"expectation":"Monitors compliance and addresses issues to keep the team operating safely.","ratings":{"needs-work":"Monitoring is inconsistent, compliance is treated as administration, or identified gaps are corrected temporarily without addressing the cause.","great":"Monitors compliance and addresses issues to keep the team operating safely.","smashing-it":"Builds routine checks, investigates recurring gaps, corrects root causes, and verifies that actions have genuinely improved safety and compliance."}},"enterprise":{"expectation":"Sets clear expectations and systems that embed safety and compliance across the business.","ratings":{"needs-work":"Policies, controls, and accountability are unclear or disconnected from how work is actually performed across the business.","great":"Sets clear expectations and systems that embed safety and compliance across the business.","smashing-it":"Integrates compliance into operating design, governance, assurance, and leadership accountability, and tests whether controls are effective in practice."}}}},{"id":"identifies-and-addresses-risk-early","name":"Identifies and addresses risk early","definition":"Anticipates potential issues and acts before they escalate.","levels":{"foundations":{"expectation":"Raises risks or concerns when they are identified.","ratings":{"needs-work":"Misses, withholds, or delays raising a risk, or reports it without enough information for others to act.","great":"Raises risks or concerns when they are identified.","smashing-it":"Notices early warning signs, records and escalates the risk with useful context, and suggests sensible immediate controls."}},"momentum":{"expectation":"Assesses risk and takes action to reduce impact or prevent recurrence.","ratings":{"needs-work":"Responds mainly after incidents, uses superficial assessments, or implements actions without checking whether risk has reduced.","great":"Assesses risk and takes action to reduce impact or prevent recurrence.","smashing-it":"Assesses likelihood and consequence, implements proportionate controls, assigns ownership, and reviews whether recurrence has been prevented."}},"enterprise":{"expectation":"Builds risk awareness and controls so emerging risks are identified and managed at scale.","ratings":{"needs-work":"Risk insight is fragmented, emerging risks lack ownership, and controls are added without a coherent view of enterprise exposure.","great":"Builds risk awareness and controls so emerging risks are identified and managed at scale.","smashing-it":"Creates horizon scanning, clear ownership, aggregated risk insight, and resilience testing so the business can act before emerging threats become material."}}}},{"id":"prevents-harm-to-people-and-customers","name":"Prevents harm to people and customers","definition":"Takes action to protect people, customers, and the business from harm.","levels":{"foundations": /* Fold the brand layer onto the workbook data, and order competencies the way
   the drivers do rather than the way the spreadsheet happens to. */
const BY_ID = {};
FRAMEWORK.competencies.forEach((c) => {
  BY_ID[c.id] = c;
  Object.assign(c, COMP_META[c.id]);
  c.behaviours.forEach((b, j) => {
    b.comp = c;
    b.index = j;
    b.key = c.id + '::' + b.id;
  });
});

DRIVERS.forEach((d) => {
  d.competencies = d.order.map((id) => {
    const c = BY_ID[id];
    if (!c) throw new Error('Driver ' + d.id + ' references unknown competency ' + id);
    c.driver = d;
    return c;
  });
});

const COMPS = DRIVERS.flatMap((d) => d.competencies);
COMPS.forEach((c, i) => {
  c.index = i;
});
const ALL_BEHAVIOURS = COMPS.flatMap((c) => c.behaviours);

const levelById = (id) => LEVELS.find((l) => l.id === id) || LEVELS[0];
const ratingById = (id) => RATINGS.find((r) => r.id === id) || null;
const compById = (id) => BY_ID[id] || null;
const behById = (compId, behId) => {
  const c = compById(compId);
  return c ? c.behaviours.find((b) => b.id === behId) || null : null;
};

   you are on, and it must never end up in the saved draft. */
let tourStep = null;
let seenTour = false;

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ a: S.a, lens: S.lens, seenTour: seenTour }));
  } catch (e) {
    /* Private browsing or a full quota — the app still works, it just forgets. */
  }
}

function restore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && saved.a && typeof saved.a === 'object') S.a = Object.assign(blankAssessment(), saved.a);
    if (saved && LEVELS.some((l) => l.id === saved.lens)) S.lens = saved.lens;
    if (saved && saved.seenTour === true) seenTour = true;
  } catch (e) {
    /* Corrupt or unreadable draft — start clean rather than crash. */
  }
}

/* ---------- Utilities ----------------------------------------------------- */

const esc = (s) =>
  String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

const pad2 = (n) => String(n).padStart(2, '0');

function formatDate(iso) {
  if (!iso) return '—';
  const parts = String(iso).split('-');
  if (parts.length !== 3) return iso;
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
}

function highlight(text, query) {
  const safe = esc(text);
  if (!query) return safe;
  const needle = esc(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(needle, 'gi'), (m) => '<mark>' + m + '</mark>');
}

/* Competency colours are used as card fills, so a matching very-light wash is
   needed for selected states. */
function washOf(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
}

let toastTimer = null;
function toast(message) {
  const node = document.getElementById('toast');
  node.textContent = message;
  node.setAttribute('data-show', 'true');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.setAttribute('data-show', 'false'), 2600);
}

function go(patch, opts) {
  Object.assign(S, patch);
  render(opts);

function setLens(id) {
  S.lens = id;

function goZoom(zoom) {
  const patch = { zoom, mode: 'explore', menu: false };
  if (zoom < 2) patch.beh = null;
  if (zoom < 1) patch.comp = null;
  go(patch);
}

/* ---------- Scoring ------------------------------------------------------- */

const ratedCount = () => ALL_BEHAVIOURS.filter((b) => S.a.ratings[b.key]).length;

function averageOf(behaviours) {
  const scores = behaviours
    .map((b) => ratingById(S.a.ratings[b.key]))
    .filter(Boolean)
    .map((r) => r.score);
  if (!scores.length) return null;
  return scores.reduce((a, b) => a + b, 0) / scores.length;
}

const compScore = (comp) => averageOf(comp.behaviours);
const driverScore = (driver) => averageOf(driver.competencies.flatMap((c) => c.behaviours));
const overallScore = () => averageOf(ALL_BEHAVIOURS);

function bandFor(score) {
  if (score == null) return { label: 'Not rated', color: C.mist };
  if (score < 1.67) return { label: 'Below the standard', color: C.red };
  if (score < 2.34) return { label: 'At the standard', color: C.lime };
  return { label: 'Above the standard', color: C.yellow };
}

function ratingTally() {
  const counts = { 'needs-work': 0, great: 0, 'smashing-it': 0 };
  ALL_BEHAVIOURS.forEach((b) => {
    const id = S.a.ratings[b.key];
    if (id && counts[id] !== undefined) counts[id] += 1;
  });
  return counts;
}

function zoomRail() {

  const crumbHtml = crumbs
    .map((c, i) => {
      const last = i === crumbs.length - 1;
      const btn =
        '<button class="crumb" data-act="zoom" data-zoom="' + c.zoom + '"' +
        (last ? ' disabled aria-current="page"' : '') + '>' + esc(c.label) + '</button>';

function searchResults() {
  const q = S.query.trim().toLowerCase();
  if (!q) return '';
  const lens = S.lens;

  const hits = ALL_BEHAVIOURS.filter((b) => {
    const hay = [b.name, b.definition, b.comp.name, b.comp.driver.name, b.levels[lens].expectation]
      .concat(Object.values(b.levels[lens].ratings))
      .join(' ')
      .toLowerCase();
    return hay.includes(q);
  });

  if (!hits.length) {
    return '<div class="empty">Nothing matches &ldquo;' + esc(S.query) + '&rdquo;. Try a shorter word.</div>';
  }

  return (
    '<p class="micro" style="color:var(--ink-soft);margin-bottom:13px">' +
    hits.length + ' of 30 behaviours &middot; showing ' + esc(levelById(lens).name) + '</p><div class="results">' +
    hits
      .map(
        (b) =>
          '<button class="result" style="' + compVars(b.comp) + '" data-act="open-beh" ' +
          'data-comp="' + b.comp.id + '" data-beh="' + b.id + '">' +
          '<span class="r-badge">' + icon(b.comp.icon, 20) + '</span>' +
          '<span style="flex:1;min-width:0">' +
          '<span class="r-comp">' + highlight(b.comp.name, S.query) + '</span>' +
          '<h4>' + highlight(b.name, S.query) + '</h4>' +
          '<p>' + highlight(b.levels[lens].expectation, S.query) + '</p>' +
          '</span></button>'
      )
      .join('') +
    '</div>'
  );
}

/* ---------- The ring -------------------------------------------------------
   One renderer for both levels of the framework: a domain with its five
   competencies, and a competency with its three behaviours. Satellites sit on
   the core's circumference and animate outward, each linked by a dotted lead
   to a chip that points back down the spoke at it.
   ------------------------------------------------------------------------- */

function ring(cfg) {
  const geo = cfg.geo;
  const placed = cfg.items.map((it) => {
    const slot = geo.slots[it.slot];
    return {
      it,
      slot,
      disc: polar(geo, slot.angle, geo.r.icon),
      // The lead starts at the disc's outer edge, not its centre, so the whole
      // dotted run is visible instead of half-hidden under the icon.
      from: polar(geo, slot.angle, geo.r.icon + geo.r.disc),
      to: polar(geo, slot.angle, geo.r.chip),
    };
  });

  const leads = placed
    .map(
      (p, i) =>
        '<line x1="' + p.from.x + '%" y1="' + p.from.y + '%" x2="' + p.to.x + '%" y2="' + p.to.y + '%" ' +
        'data-key="' + esc(p.it.key) + '" style="animation-delay:' + (240 + i * 70) + 'ms"/>'
    )
    .join('');

  const nodes = placed
    .map(
      (p, i) =>
        '<button class="orbit-node" style="' + p.it.vars +
        ';left:' + p.disc.x + '%;top:' + p.disc.y + '%;animation-delay:' + (110 + i * 70) + 'ms" ' +
        'data-key="' + esc(p.it.key) + '" ' + p.it.act + ' aria-label="' + esc(p.it.name) + '">' +
        (p.it.icon ? icon(p.it.icon, 28) : '<span class="node-num">' + esc(p.it.num || '') + '</span>') +
        '</button>'
    )
    .join('');

  const chips = placed
    .map(
      (p, i) =>
        '<button class="orbit-chip" data-side="' + p.slot.chip + '" style="' + p.it.vars +
        ';left:' + p.to.x + '%;top:' + p.to.y + '%;animation-delay:' + (290 + i * 70) + 'ms" ' +
        'data-key="' + esc(p.it.key) + '" ' + p.it.act + '>' +
        '<span class="chip-name">' + esc(p.it.name) + '</span></button>'
    )
    .join('');

  return (
    '<div class="orbit-wrap ' + (cfg.cls || '') + '" style="' + cfg.vars + '">' +
    '<div class="orbit" data-focus="" style="aspect-ratio:' + geo.box.w + ' / ' + geo.box.h + '">' +
    '<svg class="orbit-leads" preserveAspectRatio="none" aria-hidden="true">' + leads + '</svg>' +
    '<div class="orbit-core" style="top:' + geo.core.y + '%;width:' + geo.core.size + '%">' +
    cfg.core +
    '</div>' + nodes + chips +
    '</div></div>'
  );
}

function domainRing(driver) {
  return ring({
    geo: RINGS.domain,
    cls: 'page-ring',
    vars: driverVars(driver),
    core:
      '<span class="core-title">' + driver.lines.map((t) => esc(t)).join('<br>') + '</span>' +
      '<span class="core-kicker">' + esc(driver.kicker) + '</span>',
    items: driver.competencies.map((c) => ({
      key: c.id,
      name: c.name,
      icon: c.icon,
      slot: c.slot,
      vars: compVars(c),
      act: 'data-act="open-comp" data-comp="' + c.id + '"',
    })),
  });
}

function competencyRing(c) {
  return ring({
    geo: RINGS.competency,
    cls: 'comp-ring',
    vars:
      '--core:' + c.fill + ';--core-ink:' + c.ink +
      ';--core-sub:' + (c.ink === '#ffffff' ? 'rgba(255,255,255,0.8)' : 'rgba(21,7,33,0.7)'),
    core:
      '<span class="core-icon">' + icon(c.icon, 34) + '</span>' +
      '<span class="core-title">' + esc(c.name) + '</span>',
    items: c.behaviours.map((b, i) => ({
      key: b.key,
      name: b.name,
      num: pad2(i + 1),
      slot: i,
      // The competency colour identifies the core; its behaviours invert to
      // navy so three same-coloured discs do not dissolve into the circle
      // behind them.
      vars: '--fill:' + C.navy + ';--node-ink:#ffffff;--chip-ink:#ffffff;--halo:rgba(21,7,33,0.16)',
      act: 'data-act="open-beh" data-comp="' + c.id + '" data-beh="' + b.id + '"',
    })),
  });
}

/* ---------- Competency card ------------------------------------------------

   ------------------------------------------------------------------------- */

/* ---------- Assessment: rating steps -------------------------------------- */

function viewAssessStep() {
  const a = S.a;
  const l = levelById(a.level);
  const c = COMPS[Math.min(a.step, COMPS.length - 1)];
  const done = ratedCount();

  const blocks = c.behaviours
    .map((b) => {
      const chosen = a.ratings[b.key];
      return (
        '<div class="q-block" style="--lvl:' + l.color + '">' +
        '<h3>' + esc(b.name) + '</h3>' +
        '<p class="q-def">' + esc(b.definition) + '</p>' +
        '<div class="q-expect"><span>' + esc(l.name) + ' expectation</span><p>' + esc(b.levels[l.id].expectation) + '</p></div>' +
        '<div class="opt-row" role="group" aria-label="Rating for ' + esc(b.name) + '">' +
        RATINGS.map(
          (r) =>
            '<button class="opt" style="--r-color:' + r.color + ';--r-ink:' + r.ink +
            ';--r-ink-idle:' + (r.id === 'needs-work' ? r.color : C.navy) + ';--r-wash:' + r.wash + '" ' +
            'data-act="rate" data-key="' + esc(b.key) + '" data-rating="' + r.id + '" ' +
            'aria-pressed="' + (chosen === r.id) + '">' +
            '<span class="opt-tag">' + esc(r.name) + '</span>' +
            '<p>' + esc(b.levels[l.id].ratings[r.id]) + '</p></button>'
        ).join('') +
        '</div></div>'
      );
    })
    .join('');

  // Dots are grouped by driver so the two halves of the framework stay visible
  // while you work through them.
  let dots = '';
  COMPS.forEach((comp, i) => {
    if (i > 0 && comp.driver !== COMPS[i - 1].driver) dots += '<span class="dot-gap"></span>';
    const filled = comp.behaviours.every((b) => a.ratings[b.key]);
    dots +=
      '<button class="step-dot" data-act="goto-step" data-step="' + i + '" data-done="' + filled + '" ' +
      'style="--dot-color:' + comp.fill + '" aria-current="' + (i === a.step) + '" ' +
      'aria-label="' + esc(comp.driver.name + ' — ' + comp.name) + '" title="' + esc(comp.name) + '"></button>';
  });

  const complete = done === ALL_BEHAVIOURS.length;
  const last = a.step === COMPS.length - 1;

  return (
    '<div class="layer narrow" data-motion="flat" style="' + compVars(c) + '">' +
    '<div class="progress-head">' +
    '<div class="ph-left"><span class="ph-badge">' + icon(c.icon, 28) + '</span><div>' +
    '<span class="eyebrow">' + esc(c.driver.name) + ' &middot; ' + esc(l.name) + '</span>' +
    '<h1 class="headline" style="font-size:clamp(26px,4.2vw,38px);margin-top:6px">' + esc(c.name) + '</h1></div></div>' +
    '<span class="micro">Competency ' + (a.step + 1) + ' of 10 &middot; ' + done + '/30 rated</span>' +
    '</div>' +
    '<div class="track"><div class="fill" style="width:' + Math.max((done / 30) * 100, 2) + '%"></div></div>' +
    howto(
      '<b>Pick one rating for each of the three behaviours below.</b> Nothing is locked in — the coloured ' +
        'dots at the bottom jump between competencies, and you can change any answer before you finish.'
    ) +
    blocks +
    '<div class="q-block">' +
    '<div class="field" style="margin:0"><label for="f-notes">Evidence or notes on ' + esc(c.name) +
    ' <span style="color:var(--ink-soft)">(optional)</span></label>' +
    '<textarea id="f-notes" data-note="' + esc(c.id) + '" placeholder="What have you seen? Examples make the conversation much easier.">' +
    esc(a.notes[c.id] || '') + '</textarea></div></div>' +
    '<div class="step-nav">' +
    '<button class="btn ghost small" data-act="' + (a.step === 0 ? 'back-setup' : 'prev-step') + '">' +
    (a.step === 0 ? 'Details' : 'Back') + '</button>' +
    '<div class="step-dots">' + dots + '</div>' +
    '<div class="spacer"></div>' +
    (last
      ? '<button class="btn" data-act="finish"' + (complete ? '' : ' disabled') + '>' +
        (complete ? 'See the summary' : 30 - done + ' still to rate') + '</button>'
      : '<button class="btn" data-act="next-step">Next competency</button>') +
    '</div>' +
    (!complete && last
      ? '<p style="margin-top:14px"><button class="btn ghost small" data-act="goto-unrated">Jump to the first unrated behaviour</button></p>'
      : '') +
    '</div>'
  );
}

/* ---------- Assessment: report --------------------------------------------
   Built from the same two circles as the framework, so the dashboard and the
   thing it measures look like one system.
   ------------------------------------------------------------------------- */

/* A radial gauge. `score` is out of 3; the tick marks the standard, 2.0. */
function gauge(score, opts) {
  const o = opts || {};
  const r = 42;
  const circ = 2 * Math.PI * r;
  const pct = score == null ? 0 : score / 3;
  const band = bandFor(score);
  return (
    '<span class="gauge" style="--gauge-size:' + (o.size || 128) + 'px">' +
    '<svg viewBox="0 0 100 100" aria-hidden="true">' +
    '<circle class="g-track" cx="50" cy="50" r="' + r + '"/>' +
    '<circle class="g-fill" cx="50" cy="50" r="' + r + '" stroke="' + (o.color || band.color) + '" ' +
    'stroke-dasharray="' + circ + '" stroke-dashoffset="' + circ * (1 - pct) + '" ' +
    'transform="rotate(-90 50 50)"/>' +
    '<line class="g-tick" x1="50" y1="4" x2="50" y2="14" transform="rotate(240 50 50)"/>' +
    '</svg>' +
    '<span class="g-value">' + (score == null ? '—' : score.toFixed(1)) + '<small>/3</small></span>' +
    '</span>'
  );
}

function viewReport() {
  const a = S.a;
  const l = levelById(a.level);
  const overall = overallScore();
  const band = bandFor(overall);
  const tally = ratingTally();

  const ranked = COMPS.map((c) => ({ comp: c, score: compScore(c) }))
    .filter((x) => x.score != null)
    .sort((x, y) => y.score - x.score);

  const strengths = ALL_BEHAVIOURS.filter((b) => a.ratings[b.key] === 'smashing-it');
  const focus = ALL_BEHAVIOURS.filter((b) => a.ratings[b.key] === 'needs-work');
  const stretch = ranked.slice(-3).reverse();

  const compBar = (c) => {
    const score = compScore(c);
    const b = bandFor(score);
    return (
      '<div class="score-row"><span class="sr-name">' + esc(c.name) + '</span>' +
      '<span class="sr-bar"><span class="sr-mark"></span>' +
      '<span class="sr-fill" style="width:' + (score == null ? 0 : (score / 3) * 100) + '%;background:' + b.color + '"></span></span>' +
      '<span class="sr-score">' + (score == null ? '—' : score.toFixed(1)) + '</span></div>'
    );
  };

  const driverPanels = DRIVERS.map((d) => {
    const ds = driverScore(d);
    return (
      '<section class="dpanel" style="' + driverVars(d) + '">' +
      '<div class="dp-head">' + gauge(ds, { size: 116, color: d.core }) +
      '<div><span class="eyebrow">Leadership area</span><h3>' + esc(d.name) + '</h3>' +
      '<p>' + esc(d.kicker) + '</p></div></div>' +
      '<div class="dp-scores">' + d.competencies.map(compBar).join('') + '</div>' +
      '</section>'

  }).join('');

  const behaviourList = (list, numbered) =>
    '<ol class="find-list">' +
    list
      .map(
        (b, i) =>
          '<li><span class="fl-n"' + (numbered ? '' : ' data-plain="true"') + '>' + (numbered ? i + 1 : '') + '</span>' +
          '<div><b>' + esc(b.name) + '</b><span class="fl-comp">' + esc(b.comp.name) + '</span>' +
          '<p>' + esc(b.levels[l.id].ratings[a.ratings[b.key]]) + '</p></div></li>'
      )
      .join('') +
    '</ol>';

  const detail = DRIVERS.map(
    (d) =>
      '<div class="det-driver" style="' + driverVars(d) + '">' +
      '<h3 class="det-driver-name"><span class="dg-mark"></span>' + esc(d.name) + '</h3>' +
      d.competencies
        .map((c) => {
          const score = compScore(c);
          return (
            '<div class="detail-comp">' +
            '<div class="dc-head"><span class="dc-name">' + esc(c.name) + '</span>' +
            '<span class="dc-score">' + (score == null ? '—' : score.toFixed(1) + ' / 3') + '</span></div>' +
            c.behaviours
              .map((b) => {
                const r = ratingById(a.ratings[b.key]);
                return (
                  '<div class="detail-beh"><div class="db-top"><span class="db-name">' + esc(b.name) + '</span>' +
                  '<span class="db-tag" data-r="' + (r ? r.id : 'none') + '">' + esc(r ? r.name : 'Not rated') + '</span></div>' +
                  '<p>' + esc(r ? b.levels[l.id].ratings[r.id] : b.levels[l.id].expectation) + '</p></div>'
                );
              })
              .join('') +
            (a.notes[c.id] && a.notes[c.id].trim()
              ? '<div class="notes-block"><span>Evidence and notes</span><p>' + esc(a.notes[c.id].trim()) + '</p></div>'
              : '') +
            '</div>'
          );
        })
        .join('') +
      '</div>'
  ).join('');

  return (
    '<div class="layer narrow report" data-motion="flat">' +
    '<div class="rpt-actions print-hide">' +
    '<button class="btn" data-act="print">Download as PDF</button>' +
    '<button class="btn ghost small" data-act="edit-answers">Edit answers</button>' +
    '<button class="btn ghost small" data-act="reset">Start a new assessment</button>' +
    '</div>' +
    howto(
      '<b>Download as PDF to keep or share this.</b> It lives in this browser only — clearing site data or ' +
        'switching device loses it. <b>Edit answers</b> takes you back without losing anything.',
      { cls: 'print-hide' }
    ) +
    '<div class="print-brand print-only"><span>Cashies &middot; All For: 1 Leadership Framework</span>' +
    '<span>' + esc(formatDate(a.date)) + '</span></div>' +

    '<header class="rpt-head">' +
    '<div class="rh-text"><span class="eyebrow">' +
    esc(a.kind === 'self' ? 'Self assessment' : 'Team member assessment') + ' &middot; ' + esc(l.name) + '</span>' +
    '<h1 class="headline">' + esc(a.subject || 'Unnamed') + '</h1>' +
    '<p class="rh-sub">' + esc(a.role || 'Role not recorded') + '</p>' +
    '<div class="rh-meta">' +
    '<div><span>Assessor</span><b>' + esc(a.kind === 'self' ? a.subject || 'Self' : a.assessor || 'Not recorded') + '</b></div>' +
    '<div><span>Date</span><b>' + esc(formatDate(a.date)) + '</b></div>' +
    '</div></div>' +
    '<div class="rh-gauge">' + gauge(overall, { size: 150 }) +
    '<span class="rh-band">' + esc(band.label) + '</span></div>' +
    '</header>' +

    '<div class="counts">' +
    RATINGS.map(
      (r) =>
        '<div class="count"><span class="c-dot" style="background:' + r.color + '"></span>' +
        '<b>' + tally[r.id] + '</b><span>' + esc(r.name) + '</span></div>'
    ).join('') +
    '<div class="count"><span class="c-dot" style="background:var(--rule)"></span><b>30</b><span>Behaviours rated</span></div>' +
    '</div>' +

    '<div class="dpanels">' + driverPanels + '</div>' +

    '<div class="findings">' +
    '<section class="find"><h2>Strengths to keep using</h2>' +
    (strengths.length
      ? behaviourList(strengths, false)
      : '<p class="find-none">Nothing was rated Smashing It this time. The strongest competencies are ' +
        ranked.slice(0, 2).map((x) => '<b>' + esc(x.comp.name) + '</b>').join(' and ') + '.</p>') +
    '</section>' +
    '<section class="find"><h2>' + (focus.length ? 'Where to focus next' : 'Next stretch') + '</h2>' +
    (focus.length
      ? '<p class="find-lede">Rated Needs Work. Pick one or two — not all of them.</p>' + behaviourList(focus, true)
      : '<p class="find-lede">Nothing sits below the standard. These are the lowest scoring competencies.</p>' +
        '<ol class="find-list">' +
        stretch
          .map(
            (x, i) =>
              '<li><span class="fl-n">' + (i + 1) + '</span><div><b>' + esc(x.comp.name) + '</b>' +
              '<p>Scoring ' + x.score.toFixed(1) + ' of 3 across its three behaviours.</p></div></li>'
          )
          .join('') + '</ol>') +
    '</section></div>' +

    '<section class="det page-break"><h2>Every behaviour</h2>' +
    '<p class="find-lede">The full record — each behaviour, the rating given, and the descriptor that rating ' +
    'matched at ' + esc(l.name) + ' level.</p>' + detail + '</section>' +

    '<p class="print-note print-hide">Download opens your browser&rsquo;s print dialog — choose <b>Save as PDF</b> ' +
    'as the destination. Nothing leaves this device.</p>' +
    '</div>'
  );
}

/* ---------- Render -------------------------------------------------------- */

function motionDir() {
  if (S.zoom > lastZoom) return 'in';
  if (S.zoom < lastZoom) return 'out';
  return 'flat';
}

function currentView() {
  if (S.mode === 'assess') {
    if (S.a.stage === 'report') return { html: viewReport(), hint: 'Saved on this device only' };
    if (S.a.stage === 'rate') return { html: viewAssessStep(), hint: 'Draft saves as you go' };
    return { html: viewAssessSetup(), hint: 'Nothing is sent anywhere' };
  }
  if (S.zoom === 2 && S.beh) return { html: viewBehaviour(), hint: 'Esc to go back' };
  if (S.zoom === 1 && S.comp) return { html: viewCompetency(), hint: 'Esc to go back' };
  S.zoom = 0;
  return { html: viewFramework(), hint: 'Menu jumps anywhere · press / to search' };
}

/* ---------- The tour -------------------------------------------------------
   Seven stops that drive the app themselves — each one sets the state it needs
   before pointing at something real on the screen, so the reader watches the
   interface work rather than reading a description of it.
   ------------------------------------------------------------------------- */

function tourLayer() {
  const s = TOUR[tourStep];
  const last = tourStep === TOUR.length - 1;
  return (
    '<div class="tour-block" data-dim="' + (s.target ? 'false' : 'true') + '"></div>' +
    '<div class="tour-spot" aria-hidden="true"' + (s.target ? '' : ' hidden') + '></div>' +
    '<div class="tour-card" role="dialog" aria-modal="true" aria-label="Guided tour" ' +
    'data-center="' + (s.target ? 'false' : 'true') + '">' +
    '<span class="tc-count">' + (tourStep + 1) + ' of ' + TOUR.length + '</span>' +
    '<h2>' + esc(s.title) + '</h2><p>' + esc(s.body) + '</p>' +
    '<div class="tc-nav">' +
    (tourStep > 0 ? '<button class="btn ghost small" data-act="tour-back">Back</button>' : '') +
    '<button class="btn small" data-act="tour-next">' + esc(s.next || (last ? 'Done' : 'Next')) + '</button>' +
    (last ? '' : '<button class="tc-skip" data-act="tour-end">' + esc(s.skip || 'Skip tour') + '</button>') +
    '</div></div>'
  );
}

/* Resolve a step to something actually on screen. Several targets swap out at
   narrow widths — the five-point rings become lists below 1010px — so each
   step may name a fallback, and anything zero-sized is treated as absent. */
function tourTarget(s) {
  for (const q of [s.target, s.alt]) {
    if (!q) continue;
    const el = document.querySelector(q);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    if (r.width > 8 && r.height > 8) return el;
  }
  return null;
}

/* Measure after paint: the layer is written by render(), so the target only
   exists once the new screen is in the document. */
function tourPlace() {
  if (tourStep === null) return;
  const s = TOUR[tourStep];
  const card = document.querySelector('.tour-card');
  const spot = document.querySelector('.tour-spot');
  const block = document.querySelector('.tour-block');
  if (!card || !spot) return;

  const el = tourTarget(s);
  if (block) block.dataset.dim = el ? 'false' : 'true';
  if (!el) {
    card.style.left = '';
    card.style.top = '';
    card.dataset.center = 'true';
    spot.hidden = true;
    return;
  }

  spot.hidden = false;
  card.dataset.center = 'false';

  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const m = 8;
  const gap = 14;
  const pad = s.pad == null ? 12 : s.pad;

  // Clamped to the viewport: a target taller than the screen gets its visible
  // slice lit rather than a spotlight running off both edges.
  const r = el.getBoundingClientRect();
  const x = Math.max(m, r.left - pad);
  const y = Math.max(m, r.top - pad);
  const w = Math.max(28, Math.min(vw - m, r.right + pad) - x);
  const h = Math.max(28, Math.min(vh - m, r.bottom + pad) - y);
  spot.style.left = x + 'px';
  spot.style.top = y + 'px';
  spot.style.width = w + 'px';
  spot.style.height = h + 'px';

  const cw = card.offsetWidth;
  const ch = card.offsetHeight;
  const midX = Math.min(Math.max(m + 2, x + w / 2 - cw / 2), Math.max(m + 2, vw - cw - m - 2));
  const midY = Math.min(Math.max(m + 2, y + h / 2 - ch / 2), Math.max(m + 2, vh - ch - m - 2));
  let top;
  let left;

  if (y + h + gap + ch <= vh - m) {
    top = y + h + gap;
    left = midX;
  } else if (y - gap - ch >= m) {
    top = y - gap - ch;
    left = midX;
  } else if (x + w + gap + cw <= vw - m) {
    top = midY;
    left = x + w + gap;
  } else if (x - gap - cw >= m) {
    top = midY;
    left = x - gap - cw;
  } else {
    // The target fills the screen — sit in the corner rather than off it.
    top = vh - ch - 14;
    left = vw - cw - 14;
  }

  card.style.top = Math.round(top) + 'px';
  card.style.left = Math.round(left) + 'px';
}

/* Bring the target somewhere comfortable before pointing at it. */
function tourScroll() {
  if (tourStep === null) return;
  const el = tourTarget(TOUR[tourStep]);
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (r.top >= 90 && r.bottom <= window.innerHeight - 90) return;
  const to = window.scrollY + r.top - Math.max(96, (window.innerHeight - r.height) / 2);
  window.scrollTo({ top: Math.max(0, to), behavior: 'smooth' });
}

function tourGo(i) {
  if (i < 0) return;
  if (i >= TOUR.length) return tourEnd();
  tourStep = i;
  const s = TOUR[i];
  if (s.state) Object.assign(S, s.state);
  render({ keepScroll: true });
  tourScroll();
}

function tourEnd() {
  tourStep = null;
  seenTour = true;
  save();
  go({ mode: 'explore', zoom: 0, comp: null, beh: null, menu: false, query: '' });
}

window.addEventListener('resize', tourPlace);
window.addEventListener('scroll', tourPlace, { passive: true });

function confirmDialog() {
  return (
    '<div class="confirm-backdrop">' +
    '<div class="confirm-box">' +
    '<p>' + esc(pendingConfirm.message) + '</p>' +
    '<div class="confirm-btns">' +
    '<button class="btn small" data-act="confirm-yes">' + esc(pendingConfirm.ok || 'OK') + '</button>' +
    '<button class="btn ghost small" data-act="confirm-no">Cancel</button>' +
    '</div></div></div>'
  );
}

function render(opts) {
  const view = currentView();
  document.getElementById('app').innerHTML =
    '<div class="shell">' +
    spectrumBar() +
    topbar() +
    (S.mode === 'explore' ? zoomRail() : '') +
    '<main>' + view.html + '</main>' +
    footer(view.hint) +
    '</div>' +
    (S.menu ? drawer() : '') +
    (pendingConfirm ? confirmDialog() : '') +
    (tourStep !== null ? tourLayer() : '');

  document.body.style.overflow = (S.menu || pendingConfirm) ? 'hidden' : '';
  if (S.menu) {
    const first = document.querySelector('.dw-close');
    if (first) first.focus();
  }

  lastZoom = S.zoom;
  if (!opts || !opts.keepScroll) window.scrollTo({ top: 0, behavior: 'auto' });
  if (tourStep !== null) requestAnimationFrame(tourPlace);
}

/* ---------- Events -------------------------------------------------------- */

const ACTIONS = {
  home: () => go({ mode: 'explore', zoom: 0, comp: null, beh: null, menu: false, query: '' }),

  mode: (el) => go({ mode: el.dataset.mode, menu: false }),

  zoom: (el) => goZoom(Number(el.dataset.zoom)),

  'toggle-menu': () => go({ menu: !S.menu }, { keepScroll: true }),

  'close-menu': () => go({ menu: false }, { keepScroll: true }),

  'set-lens': (el) => {
    setLens(el.dataset.level);
    // Staying put is the point of a lens — it re-reads the current screen.
    render({ keepScroll: true });
  },

  // A domain is not a screen of its own any more; it is a place on the
  // framework diagram, so this scrolls the reader to its ring.
  'open-driver': (el) => {
    const id = el.dataset.driver;
    go({ mode: 'explore', zoom: 0, comp: null, beh: null, menu: false, query: '' });
    const target = document.getElementById('domain-' + id);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },

  'open-comp': (el) => go({ mode: 'explore', zoom: 1, comp: el.dataset.comp, beh: null, menu: false }),

  'open-beh': (el) => {
    // Opening a specific level's rung switches the lens to that level.
    if (el.dataset.level) setLens(el.dataset.level);
    go({ mode: 'explore', zoom: 2, comp: el.dataset.comp, beh: el.dataset.beh, menu: false });
  },

  'clear-search': () => go({ query: '' }),

  'set-kind': (el) => {
    S.a.kind = el.dataset.kind;
    save();
    render({ keepScroll: true });
  },

  'set-alevel': (el) => {
    const next = el.dataset.level;
    const rated = ratedCount();
    if (rated > 0 && S.a.level && S.a.level !== next) {
      const from = levelById(S.a.level).name;
      const to = levelById(next).name;
      pendingConfirm = {
        message: rated + ' behaviour' + (rated === 1 ? ' was' : 's were') + ' rated against ' + from + '. ' + to +
          ' describes the same behaviours at a different scope, so those ratings may no longer hold. Clear them and rate again against ' + to + '?',
        ok: 'Clear ratings',
        onConfirm: () => {
          S.a.ratings = {};
          S.a.step = 0;
          S.a.level = next;
          save();
          render({ keepScroll: true });
        },
      };
      render({ keepScroll: true });
      return;
    }
    S.a.level = next;
    save();
    render({ keepScroll: true });
  },

  'start-rating': () => {
    S.a.stage = 'rate';
    const firstGap = COMPS.findIndex((c) => c.behaviours.some((b) => !S.a.ratings[b.key]));
    S.a.step = firstGap === -1 ? 0 : firstGap;
    save();
    render();
  },

  rate: (el) => {
    S.a.ratings[el.dataset.key] = el.dataset.rating;
    save();
    render({ keepScroll: true });
  },

  'next-step': () => {
    S.a.step = Math.min(S.a.step + 1, COMPS.length - 1);
    save();
    render();
  },

  'prev-step': () => {
    S.a.step = Math.max(S.a.step - 1, 0);
    save();
    render();
  },

  'goto-step': (el) => {
    S.a.step = Number(el.dataset.step);
    save();
    render();
  },

  'goto-unrated': () => {
    const gap = COMPS.findIndex((c) => c.behaviours.some((b) => !S.a.ratings[b.key]));
    if (gap !== -1) {
      S.a.step = gap;
      save();
      render();
    }
  },

  'back-setup': () => {
    S.a.stage = 'setup';
    save();
    render();
  },

  finish: () => {
    S.a.stage = 'report';
    save();
    render();
  },

  'edit-answers': () => {
    S.a.stage = 'rate';
    save();
    render();
  },

  print: () => window.print(),

  reset: () => {
    pendingConfirm = {
      message: 'Clear this assessment and start again? This cannot be undone.',
      ok: 'Clear',
      onConfirm: () => {
        S.a = blankAssessment();
        save();
        go({ mode: 'assess' });
        toast('Assessment cleared');
      },
    };
    render({ keepScroll: true });
  },

  'confirm-yes': () => {
    const fn = pendingConfirm && pendingConfirm.onConfirm;
    pendingConfirm = null;
    if (fn) fn();
  },

  'confirm-no': () => {
    pendingConfirm = null;
    render({ keepScroll: true });
  },

  'tour-start': () => tourGo(0),
  'tour-next': () => tourGo(tourStep + 1),
  'tour-back': () => tourGo(tourStep - 1),
  'tour-end': () => tourEnd(),
};

document.addEventListener('click', (e) => {
  if (pendingConfirm && e.target.classList.contains('confirm-backdrop')) {
    pendingConfirm = null;
    render({ keepScroll: true });
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el, e);
});

/* Pointing at any part of a spoke lights the whole spoke and quiets the rest.
   Decorative only — the diagram is fully usable without it. */
function focusOrbit(orbit, key) {
  orbit.setAttribute('data-focus', key || '');
  orbit.querySelectorAll('.orbit-node, .orbit-chip, .orbit-leads line').forEach((n) => {
    n.classList.toggle('is-focus', !!key && n.dataset.key === key);
  });
}

document.addEventListener('pointerover', (e) => {
  const orbit = e.target.closest ? e.target.closest('.orbit') : null;
  if (!orbit) {
    document.querySelectorAll('.orbit:not([data-focus=""])').forEach((o) => focusOrbit(o, null));
    return;
  }
  const part = e.target.closest('[data-key]');
  focusOrbit(orbit, part && orbit.contains(part) ? part.dataset.key : null);
});

document.addEventListener('input', (e) => {
  const el = e.target;

  if (el.id === 'q') {
    S.query = el.value;
    // Patch in place rather than re-render, so the field keeps focus mid-word.
    const host = document.querySelector('[data-search-results]');
    if (host) host.innerHTML = searchResults();
    const searching = !!S.query.trim();
    document.querySelectorAll('[data-hideable]').forEach((n) => {
      n.hidden = searching;
    });
    const clear = document.querySelector('[data-act="clear-search"]');
    if (clear) clear.hidden = !searching;
    return;
  }

  if (el.dataset.field) {
    S.a[el.dataset.field] = el.value;
    save();
    const start = document.querySelector('[data-act="start-rating"]');
    if (start) start.disabled = !(S.a.level && S.a.subject.trim());
    return;
  }

  if (el.dataset.note) {
    S.a.notes[el.dataset.note] = el.value;
    save();
  }
});

document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);

  // The tour owns the keyboard while it is up.
  if (tourStep !== null) {
    if (e.key === 'Escape') tourEnd();
    else if (e.key === 'ArrowRight' || e.key === 'Enter') tourGo(tourStep + 1);
    else if (e.key === 'ArrowLeft') tourGo(tourStep - 1);
    else return;
    e.preventDefault();
    return;
  }

  if (e.key === 'Escape') {
    if (S.menu) {
      go({ menu: false }, { keepScroll: true });
      return;
    }
    if (typing) return;
    if (S.mode !== 'explore') return;
    if (S.zoom > 0) goZoom(S.zoom - 1);
    return;
  }

  if (e.key === '/' && !typing && S.mode === 'explore' && S.zoom === 0) {
    const q = document.getElementById('q');
    if (q) {
      e.preventDefault();
      q.focus();
    }
  }
});

/* ---------- Boot ---------------------------------------------------------- */

restore();
// First visit gets the tour offered rather than imposed — step one is a card
// with "No thanks" on it, and the choice is remembered either way.
if (!seenTour) tourStep = 0;
render();

</script>
